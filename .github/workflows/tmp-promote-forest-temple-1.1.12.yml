name: Promote Forest Temple 1.1.12 production files

on:
  push:
    branches:
      - release/forest-temple-1.1.12
    paths:
      - '.github/workflows/tmp-promote-forest-temple-1.1.12.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release/forest-temple-1.1.12
          fetch-depth: 0

      - name: Import validated Forest Temple build 3 files
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='fb83b772617f194064c887d68a63214088ffc968'
          git fetch origin debug
          ACTUAL="$(git rev-parse origin/debug)"
          test "$ACTUAL" = "$EXPECTED" || { echo "debug moved: $ACTUAL"; exit 1; }
          git checkout "$EXPECTED" -- \
            web/remaining-journeys-v1.js \
            web/player-v2.js \
            web/mixer-sources.json \
            web/site-locales-v10.js \
            web/credits/index.html \
            web/audio/scenes/forest_temple_journey/forest_temple_bamboo_wide_bed_001.ogg \
            web/audio/scenes/forest_temple_journey/forest_temple_bowl_distant_bed_001.ogg \
            web/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_event_001.ogg \
            web/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_original_full_001.ogg \
            web/audio/scenes/forest_temple_journey/forest_temple_moktak_event_001.ogg \
            app/src/main/java/com/scene/ambience/data/model/SourceCatalog.kt \
            app/src/main/java/com/scene/ambience/media/SceneOrchestrator.kt \
            app/src/main/res/values-ko/scene_strings.xml \
            app/src/main/res/values/scene_strings.xml \
            app/src/main/assets/ambience/manifest/scene_sources.json \
            app/src/main/assets/ambience/manifest/external_licenses.json \
            app/src/main/assets/ambience/forest_temple_journey/continuous/forest_temple_bamboo_wide_bed_001.ogg \
            app/src/main/assets/ambience/forest_temple_journey/continuous/forest_temple_bowl_bed_001.ogg \
            app/src/main/assets/ambience/forest_temple_journey/continuous/forest_temple_heart_sutra_original_full_001.ogg \
            app/src/main/assets/ambience/forest_temple_journey/events/forest_temple_heart_sutra_event_001.ogg \
            app/src/main/assets/ambience/forest_temple_journey/events/forest_temple_moktak_event_001.ogg

      - name: Apply production cache and Android version bumps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
from pathlib import Path

# Android stable version.
p=Path('app/build.gradle.kts')
s=p.read_text()
s=s.replace('versionCode = 20','versionCode = 21',1)
s=s.replace('versionName = "1.1.11"','versionName = "1.1.12"',1)
p.write_text(s)

# Production player asset cache-busters.
p=Path('web/player/index.html')
s=p.read_text()
s=s.replace('/player-v2.js?v=18','/player-v2.js?v=19')
s=s.replace('/remaining-journeys-v1.js?v=24','/remaining-journeys-v1.js?v=25')
s=s.replace('/site-locales-v10.js?v=18','/site-locales-v10.js?v=20')
p.write_text(s)

# Every production page that loads locales gets the corrected catalog immediately.
for p in Path('web').rglob('*.html'):
    if 'debug' in p.parts:
        continue
    s=p.read_text()
    s2=s.replace('/site-locales-v10.js?v=18','/site-locales-v10.js?v=20')
    if s2 != s:
        p.write_text(s2)

# Keep production SW production-named; only bump its asset cache references.
p=Path('web/sw.js')
s=p.read_text()
s=s.replace("const CACHE='lullaby-scene-site-v77'","const CACHE='lullaby-scene-site-v78'",1)
s=s.replace('/player-v2.js?v=18','/player-v2.js?v=19')
s=s.replace('/remaining-journeys-v1.js?v=24','/remaining-journeys-v1.js?v=25')
s=s.replace('/site-locales-v10.js?v=18','/site-locales-v10.js?v=20')
p.write_text(s)
PY

      - name: Validate production web and Android source manifests
        shell: bash
        run: |
          set -euo pipefail
          node --check web/remaining-journeys-v1.js
          node --check web/player-v2.js
          node --check web/site-locales-v10.js
          python3 -m json.tool web/mixer-sources.json >/dev/null
          python3 -m json.tool app/src/main/assets/ambience/manifest/scene_sources.json >/dev/null
          python3 -m json.tool app/src/main/assets/ambience/manifest/external_licenses.json >/dev/null
          grep -Fq 'gains:{departure:1,forest:.121,bowl:.227}' web/remaining-journeys-v1.js
          grep -Fq 'forest_temple_heart_sutra_original_full_001.ogg?v=2' web/mixer-sources.json
          ! grep -Fq '"id": "forest_temple_bowl"' web/mixer-sources.json
          grep -Fq '반야심경 · 한국어 독송' web/site-locales-v10.js
          grep -Fq 'FOREST_TEMPLE_BAMBOO_BED("forest_temple_bamboo_bed")' app/src/main/java/com/scene/ambience/data/model/SourceCatalog.kt
          grep -Fq 'FOREST_TEMPLE_HEART_SUTRA_EVENT("forest_temple_heart_sutra_event")' app/src/main/java/com/scene/ambience/data/model/SourceCatalog.kt
          grep -Fq 'versionCode = 21' app/build.gradle.kts
          grep -Fq 'versionName = "1.1.12"' app/build.gradle.kts
          grep -Fq "const CACHE='lullaby-scene-site-v78'" web/sw.js

      - name: Run Android unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Commit production promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tmp-promote-forest-temple-1.1.12.yml
          git add web app RELEASE_NOTES_1.1.12.md .github/workflows/release-1.1.12.yml
          git status --short
          git commit -m 'Release Forest Temple audio parity for web and Android'
          git push origin HEAD:release/forest-temple-1.1.12
