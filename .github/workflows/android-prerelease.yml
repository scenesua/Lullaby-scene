name: Validate and prerelease Android

on:
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'RELEASE_NOTES_1.0.4-beta.1.md'
      - '.github/workflows/android-prerelease.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'RELEASE_NOTES_1.0.4-beta.1.md'
      - '.github/workflows/android-prerelease.yml'

permissions:
  contents: write

concurrency:
  group: android-prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Validate Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build release APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Stage prerelease APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Lullaby-Scene-1.0.4-beta.1.apk
          ls -lh Lullaby-Scene-1.0.4-beta.1.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lullaby-Scene-1.0.4-beta.1
          path: Lullaby-Scene-1.0.4-beta.1.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.0.4-beta.1
          APK: Lullaby-Scene-1.0.4-beta.1.apk
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK#Lullaby Scene 1.0.4 beta 1 APK" \
              --target "$GITHUB_SHA" \
              --title 'Lullaby Scene 1.0.4 beta 1' \
              --notes-file RELEASE_NOTES_1.0.4-beta.1.md \
              --prerelease
          fi
          gh release view "$TAG" --json url,isPrerelease,tagName,name
