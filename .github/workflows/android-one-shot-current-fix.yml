name: Apply current Android journey/audio fix

on:
  push:
    branches:
      - work/lullaby-2.0-audio-foundation
    paths:
      - '.github/workflows/android-one-shot-current-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lullaby-2.0-audio-foundation
          fetch-depth: 0
      - name: Patch Android journey controls and audio safety
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern missing in {path}: {old[:100]!r}')
              s=s.replace(old,new,count)
              p.write_text(s)

          # Commands: actual phase-step command, not an approximate +/- minutes seek.
          p='app/src/main/java/com/scene/ambience/media/Commands.kt'
          replace(p,
              '    const val SEEK_SCENE = "com.scene.ambience.cmd.seek_scene"\n',
              '    const val SEEK_SCENE = "com.scene.ambience.cmd.seek_scene"\n    const val STEP_SCENE_PHASE = "com.scene.ambience.cmd.step_scene_phase"\n')
          replace(p,
              '    const val EXTRA_ELAPSED_MS = "elapsed_ms"\n',
              '    const val EXTRA_ELAPSED_MS = "elapsed_ms"\n    const val EXTRA_DIRECTION = "direction"\n')
          replace(p,
              '    fun seekScene(elapsedMs: Long): SessionCommand =\n        SessionCommand(SEEK_SCENE, Bundle().apply { putLong(EXTRA_ELAPSED_MS, elapsedMs.coerceAtLeast(0L)) })\n\n',
              '    fun seekScene(elapsedMs: Long): SessionCommand =\n        SessionCommand(SEEK_SCENE, Bundle().apply { putLong(EXTRA_ELAPSED_MS, elapsedMs.coerceAtLeast(0L)) })\n\n    fun stepScenePhase(direction: Int): SessionCommand =\n        SessionCommand(STEP_SCENE_PHASE, Bundle().apply { putInt(EXTRA_DIRECTION, if (direction < 0) -1 else 1) })\n\n')
          replace(p,
              '        SessionCommand(SEEK_SCENE, Bundle()),\n',
              '        SessionCommand(SEEK_SCENE, Bundle()),\n        SessionCommand(STEP_SCENE_PHASE, Bundle()),\n')

          # Orchestrator: phase boundaries from the real seeded timeline + stronger aircraft whistle guard.
          p='app/src/main/java/com/scene/ambience/media/SceneOrchestrator.kt'
          seek='''    fun seekToElapsedMs(elapsedMs: Long) {\n        val current = _state.value\n        val plan = timeline ?: return\n        if (!current.active) return\n        val target = elapsedMs.coerceIn(0L, plan.journeyEndMs)\n        _state.value = current.copy(elapsedMs = target)\n        applyFrame()\n        if (target >= plan.journeyEndMs) engine.stop()\n    }\n\n'''
          step=seek+'''    fun stepPhase(direction: Int) {\n        val current = _state.value\n        val plan = timeline ?: return\n        if (!current.active) return\n        val phases = listOf(\n            STATE_TAXI_OUT to 0L,\n            STATE_TAKEOFF to plan.taxiOutEndMs,\n            STATE_CLIMB to plan.takeoffEndMs,\n            STATE_CRUISE to plan.climbEndMs,\n            STATE_DESCENT to plan.descentStartMs,\n            STATE_APPROACH to plan.approachStartMs,\n            STATE_TAXI_IN to plan.touchdownMs,\n            STATE_ARRIVED to plan.journeyEndMs,\n        )\n        val phase = plan.phaseAt(current.elapsedMs)\n        val index = phases.indexOfFirst { it.first == phase }.coerceAtLeast(0)\n        val targetIndex = (index + if (direction < 0) -1 else 1).coerceIn(0, phases.lastIndex)\n        seekToElapsedMs(phases[targetIndex].second)\n    }\n\n'''
          replace(p,seek,step)
          replace(p,
              '''        val highSoftening = (16f * macros.nightDepth + 8f * (1f - macros.enginePresence)).toInt()\n        bands[0] = (bands[0] + lowBody).coerceIn(-1500, 1500)\n        if (count >= 2) bands[count - 2] = (bands[count - 2] - highSoftening / 2).coerceIn(-1500, 1500)\n        bands[count - 1] = (bands[count - 1] - highSoftening).coerceIn(-1500, 1500)\n''',
              '''        val highSoftening = (80f * macros.nightDepth + 35f * (1f - macros.enginePresence)).toInt()\n        // Taxi has no journey event audio, yet the whistle is audible there. Keep a\n        // source-specific safety cut on the two upper EQ regions for the entire\n        // aircraft scene instead of trying to hide it with broadband denoise.\n        val whistleGuardPresenceMb = 420\n        val whistleGuardUpperMb = 650\n        bands[0] = (bands[0] + lowBody).coerceIn(-1500, 1500)\n        if (count >= 2) bands[count - 2] = (bands[count - 2] - whistleGuardPresenceMb - highSoftening / 2).coerceIn(-1500, 1500)\n        bands[count - 1] = (bands[count - 1] - whistleGuardUpperMb - highSoftening).coerceIn(-1500, 1500)\n''')

          # Service/controller/viewmodel plumbing.
          p='app/src/main/java/com/scene/ambience/media/AmbiencePlaybackService.kt'
          replace(p,
              '            Commands.SEEK_SCENE -> sceneOrchestrator.seekToElapsedMs(args.getLong(Commands.EXTRA_ELAPSED_MS, 0L))\n',
              '            Commands.SEEK_SCENE -> sceneOrchestrator.seekToElapsedMs(args.getLong(Commands.EXTRA_ELAPSED_MS, 0L))\n            Commands.STEP_SCENE_PHASE -> sceneOrchestrator.stepPhase(args.getInt(Commands.EXTRA_DIRECTION, 1))\n')
          p='app/src/main/java/com/scene/ambience/controller/AmbienceControllerRepository.kt'
          replace(p,
              '    fun seekScene(elapsedMs: Long) = dispatch(Commands.seekScene(elapsedMs))\n',
              '    fun seekScene(elapsedMs: Long) = dispatch(Commands.seekScene(elapsedMs))\n    fun stepScenePhase(direction: Int) = dispatch(Commands.stepScenePhase(direction))\n')
          p='app/src/main/java/com/scene/ambience/presentation/AmbienceViewModel.kt'
          replace(p,
              '    fun seekScene(elapsedMs: Long) = controllerRepository.seekScene(elapsedMs)\n',
              '    fun seekScene(elapsedMs: Long) = controllerRepository.seekScene(elapsedMs)\n    fun previousScenePhase() = controllerRepository.stepScenePhase(-1)\n    fun nextScenePhase() = controllerRepository.stepScenePhase(1)\n')

          # Scene UI: explicit phase buttons above the scrubber.
          p='app/src/main/java/com/scene/ambience/ui/screens/ScenesScreen.kt'
          needle='''                        Column(verticalArrangement = Arrangement.spacedBy(2.dp)) {\n                            Slider(\n'''
          repl='''                        Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                            Row(\n                                modifier = Modifier.fillMaxWidth(),\n                                horizontalArrangement = Arrangement.spacedBy(8.dp),\n                            ) {\n                                OutlinedButton(\n                                    onClick = viewModel::previousScenePhase,\n                                    modifier = Modifier.weight(1f),\n                                ) { Text(context.getString(R.string.scene_previous_phase)) }\n                                Button(\n                                    onClick = viewModel::nextScenePhase,\n                                    modifier = Modifier.weight(1f),\n                                ) { Text(context.getString(R.string.scene_next_phase)) }\n                            }\n                            Slider(\n'''
          replace(p,needle,repl)

          # Localized labels.
          for path, previous, next_ in [
              ('app/src/main/res/values/scene_strings.xml','◀ Previous phase','Next phase ▶'),
              ('app/src/main/res/values-ko/scene_strings.xml','◀ 이전 단계','다음 단계 ▶'),
          ]:
              p=Path(path); s=p.read_text()
              marker='</resources>'
              if 'scene_previous_phase' not in s:
                  s=s.replace(marker, f'    <string name="scene_previous_phase">{previous}</string>\n    <string name="scene_next_phase">{next_}</string>\n{marker}')
                  p.write_text(s)

          # Space effect: keep low-value steady noises restrained, but let\n          # naturally wide ambience respond more strongly than the global knob.
          p='app/src/main/java/com/scene/ambience/media/AmbienceEngine.kt'
          replace(p,
              '''    private fun spaceSensitivity(sourceId: String?): Float = when (sourceId) {\n        "forest" -> 0.96f\n        "bamboo_forest" -> 0.94f\n        "cafe" -> 0.92f\n        "birds" -> 0.90f\n        "aircraft_cabin" -> 0.88f\n        "train" -> 0.86f\n        "crickets" -> 0.84f\n        "ocean" -> 0.82f\n        "wind" -> 0.80f\n        "city" -> 0.80f\n        "stream", "water" -> 0.78f\n        "singing_bowl" -> 0.76f\n        "thunder" -> 0.72f\n        "rain" -> 0.68f\n        "fire" -> 0.62f\n        "ventilation" -> 0.32f\n        "fan" -> 0.24f\n        "white_noise" -> 0.14f\n        "pink_noise" -> 0.12f\n        "brown_noise" -> 0.10f\n        else -> 0.55f\n    }\n''',
              '''    private fun spaceSensitivity(sourceId: String?): Float = when (sourceId) {\n        "forest" -> 1.25f\n        "bamboo_forest" -> 1.22f\n        "cafe" -> 1.18f\n        "birds" -> 1.16f\n        "aircraft_cabin" -> 1.12f\n        "train" -> 1.12f\n        "crickets" -> 1.10f\n        "ocean" -> 1.10f\n        "wind" -> 1.06f\n        "city" -> 1.06f\n        "stream", "water" -> 1.04f\n        "singing_bowl" -> 1.00f\n        "thunder" -> 0.94f\n        "rain" -> 0.90f\n        "fire" -> 0.76f\n        "ventilation" -> 0.32f\n        "fan" -> 0.24f\n        "white_noise" -> 0.14f\n        "pink_noise" -> 0.12f\n        "brown_noise" -> 0.10f\n        else -> 0.58f\n    }\n''')
          PY
          git diff --check
          git status --short
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main
          git commit -m 'fix(android): add phase stepping and tune aircraft space safety'
          git push origin HEAD:work/lullaby-2.0-audio-foundation
