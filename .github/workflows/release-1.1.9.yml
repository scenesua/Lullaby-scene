name: Publish Android v1.1.9

on:
  push:
    branches:
      - main
    paths:
      - 'RELEASE_NOTES_1.1.9.md'
      - '.github/workflows/release-1.1.9.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lullaby-v1.1.9-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - name: Check whether v1.1.9 is already published
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.9 >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'v1.1.9 already exists; nothing to publish.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: steps.release_state.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify stable version
        if: steps.release_state.outputs.exists != 'true'
        run: |
          grep -q 'versionCode = 18' app/build.gradle.kts
          grep -q 'versionName = "1.1.9"' app/build.gradle.kts
          chmod +x gradlew
      - name: Load persistent release signing key
        if: steps.release_state.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.LULLABY_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LULLABY_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LULLABY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LULLABY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!value:-}" || { echo "::error::$value is required"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lullaby-release.jks"
          chmod 600 "$RUNNER_TEMP/lullaby-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/lullaby-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "LULLABY_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lullaby-release.jks" >> "$GITHUB_ENV"
          echo "LULLABY_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LULLABY_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LULLABY_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Test and build signed release APK
        if: steps.release_state.outputs.exists != 'true'
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease --stacktrace
      - name: Verify release APK signer
        if: steps.release_state.outputs.exists != 'true'
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -s "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Prepare release assets
        if: steps.release_state.outputs.exists != 'true'
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/Lullaby-Scene-v1.1.9.apk
          sha256sum dist/Lullaby-Scene-v1.1.9.apk > dist/Lullaby-Scene-v1.1.9.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.release_state.outputs.exists != 'true'
        with:
          name: Lullaby-Scene-v1.1.9
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: steps.release_state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.1.9'
          SHA="$(git rev-parse HEAD)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG was published by another run; leaving it unchanged."
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --target "$SHA" \
            --title 'Lullaby Scene v1.1.9' \
            --notes-file RELEASE_NOTES_1.1.9.md \
            --latest


