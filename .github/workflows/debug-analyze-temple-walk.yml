name: Analyze Forest Temple stage one audio
on:
  push:
    branches: [debug]
    paths: ['.github/workflows/debug-analyze-temple-walk.yml']
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: debug
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
      - name: Analyze stage one files
        run: |
          echo '=== WALK ==='
          ffmpeg -hide_banner -i web/audio/scenes/forest_temple_journey/forest_temple_path_walk_001.ogg -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume|Duration'
          echo '=== BAMBOO ==='
          ffmpeg -hide_banner -i web/audio/bamboo_forest.ogg -af volumedetect -f null - 2>&1 | grep -E 'mean_volume|max_volume|Duration'
