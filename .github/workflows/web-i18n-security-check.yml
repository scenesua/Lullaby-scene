name: Validate web i18n and security

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'app/src/main/res/values/**'
      - 'app/src/main/res/values-ko/**'
      - '.github/scripts/translation-coverage-smoke.mjs'
      - '.github/scripts/web-i18n-security-smoke.mjs'
      - '.github/scripts/web-sw-security-smoke.mjs'
      - '.github/workflows/web-i18n-security-check.yml'

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install browser and Worker tooling
        run: npm install --no-save playwright-core@1.55.0 wrangler@4

      - name: Static security and stability assertions
        shell: bash
        run: |
          set -euo pipefail
          node --check web/site-locales-v10.js
          node --check web/i18n-runtime-v3.js
          node --check web/mobile-android-shell-v1.js
          node --check web/legal-language-v9.js
          node --check web/site.js
          node --check web/player-controls-v11.js
          node --check web/scene-recipe-v1.js
          node --check web/_worker.js
          node .github/scripts/translation-coverage-smoke.mjs
          node .github/scripts/web-sw-security-smoke.mjs
          grep -Fq "frame-ancestors 'none'" web/_worker.js
          grep -Fq "'X-Frame-Options':'DENY'" web/_worker.js
          grep -Fq "script-src 'self'; script-src-attr 'none'" web/_worker.js
          grep -Fq "object-src 'none'" web/_worker.js
          grep -Fq "frame-src 'none'" web/_worker.js
          grep -Fq "'Strict-Transport-Security':'max-age=31536000; includeSubDomains'" web/_worker.js
          grep -Fq "fetchSite&&fetchSite!=='same-origin'" web/_worker.js
          grep -Fq "origin!==ownOrigin" web/_worker.js
          grep -Fq "!rawLength" web/_worker.js
          grep -Fq "startsWith('application/json')" web/_worker.js
          ! grep -Fq 'HTMLRewriter' web/_worker.js
          ! grep -Fq 'eval(' web/player-controls-v11.js
          node -e "const r=require('./web/_routes.json');if(JSON.stringify(r.include)!=='[\"/*\"]'||r.exclude.length)process.exit(1)"
          for page in web/index.html web/player/index.html web/download/index.html web/privacy/index.html web/terms/index.html web/credits/index.html web/blackout/index.html web/404.html; do
            grep -Fq '/site-locales-v10.js?v=24' "$page"
            grep -Fq '/i18n-runtime-v3.js?v=11' "$page"
            grep -Fq '/mobile-android-shell-v1.js?v=8' "$page"
          done
          grep -Fq '/site-locales-v10.js?v=24' web/sw.js
          grep -Fq '/i18n-runtime-v3.js?v=11' web/sw.js
          grep -Fq '/mobile-android-shell-v1.js?v=8' web/sw.js
          ! grep -Fq 'i18n-catalog-v2.js' web/_worker.js
          ! grep -Fq "observe(host,{childList:true,subtree:true" web/i18n-runtime-v3.js
          ! grep -Eq "script-src[^;]*unsafe-(inline|eval)" web/_worker.js

      - name: Browser localization and renderer stability smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory web >/tmp/lullaby-i18n-static.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/player/ >/dev/null && break; sleep 0.5; done
          timeout 120s node .github/scripts/web-i18n-security-smoke.mjs

      - name: Worker header and anti-clickjacking smoke
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages dev web --port 4174 --ip 127.0.0.1 --d1 VISITOR_DB=00000000-0000-0000-0000-000000000000 --log-level error --show-interactive-dev-session=false >/tmp/lullaby-wrangler.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill $WRANGLER_PID || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4174/ >/dev/null && break; sleep 0.5; done
          curl -fsS -D /tmp/headers -o /tmp/home http://127.0.0.1:4174/player/
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' /tmp/headers
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' /tmp/headers
          grep -Eiq '^content-security-policy:.*frame-ancestors .none.' /tmp/headers
          grep -Eiq '^content-security-policy:.*object-src .none.' /tmp/headers
          grep -Eiq '^strict-transport-security:[[:space:]]*max-age=31536000' /tmp/headers
          grep -Fq 'site-locales-v10.js?v=24' /tmp/home
          grep -Fq 'i18n-runtime-v3.js?v=11' /tmp/home
          grep -Fq 'mobile-android-shell-v1.js?v=8' /tmp/home
          curl -fsS http://127.0.0.1:4174/.well-known/security.txt | grep -Fq 'mailto:scenesuastudio@gmail.com'

          code=$(curl -sS -o /tmp/cross.json -w '%{http_code}' -X POST \
            -H 'Origin: https://evil.example' \
            -H 'Content-Type: application/json' \
            --data '{"day":"'"$(date -u +%F)"'"}' \
            http://127.0.0.1:4174/api/visitors)
          test "$code" = '403'

          code=$(curl -sS -o /tmp/no-origin.json -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data '{"day":"'"$(date -u +%F)"'"}' \
            http://127.0.0.1:4174/api/visitors)
          test "$code" = '403'

          code=$(curl --http1.1 -sS -o /tmp/chunked.json -w '%{http_code}' -X POST \
            -H 'Origin: http://127.0.0.1:4174' \
            -H 'Content-Type: application/json' \
            -H 'Transfer-Encoding: chunked' \
            --data-binary '{"day":"'"$(date -u +%F)"'"}' \
            http://127.0.0.1:4174/api/visitors)
          test "$code" = '403'

          code=$(curl -sS -o /tmp/form.json -w '%{http_code}' -X POST \
            -H 'Content-Type: text/plain' \
            --data '{"day":"'"$(date -u +%F)"'"}' \
            http://127.0.0.1:4174/api/visitors)
          test "$code" = '403'

          code=$(curl -sS -o /tmp/ok.json -w '%{http_code}' -X POST \
            -H 'Origin: http://127.0.0.1:4174' \
            -H 'Content-Type: application/json' \
            --data '{"day":"'"$(date -u +%F)"'"}' \
            http://127.0.0.1:4174/api/visitors)
          test "$code" = '200'
          node -e "const x=require('fs').readFileSync('/tmp/ok.json','utf8');const j=JSON.parse(x);if(!j.available||j.mode!=='pageviews'||j.incremented!==true||j.today<1||j.total<1)throw new Error(x)"

  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Firefox and WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox webkit
          sudo apt-get install -y pulseaudio

      - name: Run the shared browser smoke suite
        shell: bash
        run: |
          set -euo pipefail
          # Firefox Web Audio needs an output device even in a headless runner.
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=browser_tests
          pactl set-default-sink browser_tests
          python3 .github/scripts/serve-web-smoke.py >/tmp/lullaby-cross-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/player/ >/dev/null && break; sleep 0.5; done
          for browser in firefox webkit; do
            BROWSER="$browser" timeout 120s node .github/scripts/web-i18n-security-smoke.mjs
            BROWSER="$browser" timeout 120s node .github/scripts/web-preset-picker-smoke.mjs
          done
