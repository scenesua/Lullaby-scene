name: Generate web app icons

on:
  push:
    branches:
      - work/lullaby-web-foundation
    paths:
      - '.github/workflows/generate-webapp-icons.yml'
      - '.github/scripts/generate-webapp-icons.py'
      - 'app/src/main/res/drawable-nodpi/ic_launcher_art.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lullaby-web-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate PNG icons
        run: python .github/scripts/generate-webapp-icons.py
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/icon-webapp-192.png web/assets/icon-webapp-512.png web/assets/icon-webapp-maskable-512.png
          if git diff --cached --quiet; then
            echo "Generated icons are already current."
            exit 0
          fi
          git commit -m "Generate self-contained web app icons"
          git push origin HEAD:work/lullaby-web-foundation
