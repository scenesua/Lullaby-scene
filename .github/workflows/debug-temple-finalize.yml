name: Final Forest Temple debug tuning
on:
  push:
    branches: [debug]
    paths: ['.github/workflows/debug-temple-finalize.yml']
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: debug
          fetch-depth: 0
      - name: Apply prepared tuning
        run: python3 tools/debug_temple_finalize.py
      - name: Validate JavaScript and expected values
        run: |
          node --check web/remaining-journeys-v1.js
          node --check web/debug-bridge-v1.js
          node --check web/debug-console-v1.js
          grep -Fq 'forest:.215,bowl:.113' web/remaining-journeys-v1.js
          grep -Fq "sutra?.101" web/remaining-journeys-v1.js
          grep -Fq "sutra?.157" web/remaining-journeys-v1.js
          grep -Fq "base==='ko'" web/remaining-journeys-v1.js
          grep -Fq 'gain.value=.227' web/debug-bridge-v1.js
      - name: Commit debug tuning
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/remaining-journeys-v1.js web/debug-bridge-v1.js web/debug-console-v1.js web/debug/index.html web/player/index.html web/sw.js
          git commit -m 'Tune Forest Temple levels and localized stages on debug'
          git fetch origin debug
          git rebase origin/debug
          git push origin HEAD:debug
