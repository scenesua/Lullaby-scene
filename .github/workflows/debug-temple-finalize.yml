name: Tune Forest Temple debug mix and locale stages
on:
  push:
    branches: [debug]
    paths: ['.github/workflows/debug-temple-finalize.yml']
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: debug
          fetch-depth: 0
      - name: Patch mix, phase localization and cache keys
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing patch target: {label}')
              return text.replace(old, new, 1)

          p=Path('web/remaining-journeys-v1.js')
          s=p.read_text()
          s=replace_once(s,"gains:{departure:.34,forest:.34,bowl:.09}","gains:{departure:.34,forest:.215,bowl:.113}",'temple gains')
          old="""  const korean=()=>((window.LullabyI18n?.language||document.documentElement.lang||'en')==='ko');
  const local=value=>value[korean()?1:0];
  const phaseName=value=>window.LullabyCatalogI18n?.phaseName?.(value[0])||local(value);"""
          new="""  const language=()=>String(window.LullabyI18n?.language||document.documentElement.lang||'en').trim();
  const languageBase=()=>language().toLowerCase().split('-')[0];
  const korean=()=>languageBase()==='ko';
  const local=value=>value[korean()?1:0];
  const phaseName=value=>{
    if(!Array.isArray(value))return String(value??'');
    const lang=language(),base=languageBase();
    if(base==='ko')return value[1]||value[0]||'';
    if(base==='en')return value[0]||value[1]||'';
    const translated=window.LullabyCatalogI18n?.phaseName?.(value[0],lang);
    return translated||value[0]||value[1]||'';
  };"""
          s=replace_once(s,old,new,'phase locale resolver')
          s=replace_once(s,"sutra?.09:type==='gravel'?.075:.09","sutra?.101:type==='gravel'?.075:.09",'scheduled sutra +1 dB')
          s=replace_once(s,"sutra?.14:picked==='gravel'?.075:.09","sutra?.157:picked==='gravel'?.075:.09",'debug sutra +1 dB')
          p.write_text(s)

          p=Path('web/debug-bridge-v1.js')
          s=p.read_text()
          s=replace_once(s,"node.filter.frequency.value=4400;node.gain.gain.value=.18;templeBowlPreviewNode=node;return node;","node.filter.frequency.value=4400;node.gain.gain.value=.227;templeBowlPreviewNode=node;return node;",'bowl preview base +2 dB')
          s=replace_once(s,"node.gain.gain.setValueAtTime(.18,ctx.currentTime)","node.gain.gain.setValueAtTime(.227,ctx.currentTime)",'bowl preview trigger +2 dB')
          p.write_text(s)

          p=Path('web/debug-console-v1.js')
          s=p.read_text()
          s=replace_once(s,"doc.getElementById('lullabyDebugBridgeForceV7')?.remove();for(const id of['lullabyDebugBridgeForceV6','lullabyDebugBridgeForceV5','lullabyDebugBridgeForceV4'])doc.getElementById(id)?.remove();const script=doc.createElement('script');script.id='lullabyDebugBridgeForceV7';script.src=`/debug-bridge-v1.js?v=7&force=${Date.now()}`","doc.getElementById('lullabyDebugBridgeForceV8')?.remove();for(const id of['lullabyDebugBridgeForceV7','lullabyDebugBridgeForceV6','lullabyDebugBridgeForceV5','lullabyDebugBridgeForceV4'])doc.getElementById(id)?.remove();const script=doc.createElement('script');script.id='lullabyDebugBridgeForceV8';script.src=`/debug-bridge-v1.js?v=8&force=${Date.now()}`",'fresh bridge v8')
          s=replace_once(s,"최신 브리지 v7","최신 브리지 v8",'debug notice v8')
          p.write_text(s)

          p=Path('web/player/index.html')
          s=p.read_text().replace('/remaining-journeys-v1.js?v=29','/remaining-journeys-v1.js?v=30').replace('/debug-bridge-v1.js?v=7','/debug-bridge-v1.js?v=8')
          p.write_text(s)

          p=Path('web/debug/index.html')
          s=p.read_text().replace('/debug-console-v1.js?v=8','/debug-console-v1.js?v=9')
          p.write_text(s)

          p=Path('web/sw.js')
          s=p.read_text().replace("lullaby-scene-debug-v16","lullaby-scene-debug-v17").replace('/remaining-journeys-v1.js?v=29','/remaining-journeys-v1.js?v=30').replace('/debug-console-v1.js?v=8','/debug-console-v1.js?v=9').replace('/debug-bridge-v1.js?v=7','/debug-bridge-v1.js?v=8')
          p.write_text(s)
          PY
          node --check web/remaining-journeys-v1.js
          node --check web/debug-bridge-v1.js
          node --check web/debug-console-v1.js
          grep -Fq 'forest:.215,bowl:.113' web/remaining-journeys-v1.js
          grep -Fq "sutra?.101" web/remaining-journeys-v1.js
          grep -Fq "sutra?.157" web/remaining-journeys-v1.js
          grep -Fq "base==='ko'" web/remaining-journeys-v1.js
          grep -Fq 'gain.value=.227' web/debug-bridge-v1.js
      - name: Commit debug tuning
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/remaining-journeys-v1.js web/debug-bridge-v1.js web/debug-console-v1.js web/debug/index.html web/player/index.html web/sw.js
          git commit -m 'Tune Forest Temple levels and localized stages on debug'
          git fetch origin debug
          git rebase origin/debug
          git push origin HEAD:debug
