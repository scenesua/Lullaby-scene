name: Verify production web deployment

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/production-web-smoke.yml'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Cloudflare production and verify blackout v4 plus all Journeys
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..36}; do
            if curl -fsS --max-time 10 -D /tmp/player.headers -o /tmp/player.html -H 'Cache-Control: no-cache' "https://lullabyscene.com/player/?deploycheck=${GITHUB_SHA}" \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/display-tools-v1.js?v=5&deploycheck=${GITHUB_SHA}" > /tmp/display.js \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/display-tools-v1.css?v=3&deploycheck=${GITHUB_SHA}" > /tmp/display.css \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/player-v2.js?v=19&deploycheck=${GITHUB_SHA}" > /tmp/player.js \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/scene-audio-v2.js?v=17&deploycheck=${GITHUB_SHA}" > /tmp/scene-audio.js \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/train-journey-v1.js?v=13&deploycheck=${GITHUB_SHA}" > /tmp/train.js \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/remaining-journeys-v1.js?v=29&deploycheck=${GITHUB_SHA}" > /tmp/remaining.js \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/journey-background-v1.js?v=15&deploycheck=${GITHUB_SHA}" > /tmp/background.js \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/assets/journeys/spacecraft.webp?deploycheck=${GITHUB_SHA}" > /tmp/spacecraft.webp \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/assets/journeys/forest-temple.webp?deploycheck=${GITHUB_SHA}" > /tmp/forest-temple.webp \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/credits/?deploycheck=${GITHUB_SHA}" > /tmp/credits.html \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/train_journey/train_journey_bed_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/train-bed.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/ferry_journey/ferry_journey_departure_001.ogg?v=4&deploycheck=${GITHUB_SHA}" > /tmp/ferry-departure.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/ferry_journey/ferry_journey_arrival_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/ferry.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/spacecraft_journey/spacecraft_journey_transition_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/spacecraft.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/submarine_journey/submarine_sonar_event_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/submarine.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_event_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/forest-temple-heart.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/forest_temple_journey/forest_temple_path_walk_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/forest-temple-path.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/forest_temple_journey/forest_temple_forest_bed_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/forest-temple-forest.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/forest_temple_journey/forest_temple_korean_distant_birds_bed_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/forest-temple-birds.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/forest.ogg?v=3&deploycheck=${GITHUB_SHA}&attempt=${i}" > /tmp/forest.ogg \
              && curl -sS --max-time 10 -D /tmp/api.headers -o /tmp/api.json -H 'Cache-Control: no-cache' "https://lullabyscene.com/api/visitors?deploycheck=${GITHUB_SHA}"; then
              if grep -q 'display-tools-v1.js?v=5' /tmp/player.html \
                && grep -q 'display-tools-v1.css?v=3' /tmp/player.html \
                && grep -q 'player-v2.js?v=19' /tmp/player.html \
                && grep -q 'scene-audio-v2.js?v=17' /tmp/player.html \
                && grep -q 'train-journey-v1.js?v=13' /tmp/player.html \
                && grep -q 'remaining-journeys-v1.js?v=29' /tmp/player.html \
                && grep -q 'journey-background-v1.js?v=15' /tmp/player.html \
                && grep -q "TRAIN_ID='train_journey'" /tmp/train.js \
                && grep -q 'makeCrossfadeLoopNode' /tmp/player.js \
                && grep -q 'makeCrossfadeLoopNode' /tmp/scene-audio.js \
                && grep -q 'ferry_journey' /tmp/remaining.js \
                && grep -q 'spacecraft_journey' /tmp/remaining.js \
                && grep -q 'submarine_journey' /tmp/remaining.js \
                && grep -q 'forest_temple_journey' /tmp/remaining.js \
                && grep -q 'forest_temple_path_walk_001.ogg?v=1' /tmp/remaining.js \
                && grep -q 'forest_temple_forest_bed_001.ogg?v=1' /tmp/remaining.js \
                && grep -q 'forest_temple_korean_distant_birds_bed_001.ogg?v=1' /tmp/remaining.js \
                && grep -q 'bedStartsAtPhaseBoundary:true' /tmp/remaining.js \
                && grep -q "'forest_temple_journey','hood_journey'" /tmp/remaining.js \
                && grep -q 'spacecraft_journey' /tmp/background.js \
                && grep -q 'forest-temple' /tmp/background.js \
                && test "$(wc -c < /tmp/spacecraft.webp)" -gt 10000 \
                && test "$(head -c 4 /tmp/spacecraft.webp)" = 'RIFF' \
                && test "$(wc -c < /tmp/forest-temple.webp)" -gt 10000 \
                && test "$(head -c 4 /tmp/forest-temple.webp)" = 'RIFF' \
                && grep -q 'Attribution Credits' /tmp/credits.html \
                && echo 'eb19517370cebb7921a15bd29764f16406cc442f011fa14ce01940312e743a72  /tmp/train-bed.ogg' | sha256sum -c - \
                && echo 'b01b3d63105b9439a728fe06222dab030a0ce5e516b84fa31aa77cd8543a4dc4  /tmp/ferry-departure.ogg' | sha256sum -c - \
                && echo '6439ec0e9029126670bcf94b576261e0dbf40e304300b27221e6268b58a51932  /tmp/ferry.ogg' | sha256sum -c - \
                && echo 'b0eacd4243ab44f934c14884750b021dea9beb891bdf456a7b3c14ae3d1b19b0  /tmp/spacecraft.ogg' | sha256sum -c - \
                && echo '2b2c9089ce20af23fae721d5b3007c5e579f26b5f3c1623df1b9329d020c41f7  /tmp/submarine.ogg' | sha256sum -c - \
                && echo '30c52dd70ba9d28f5fdf52e83156c3cd281450bc256c2bbd944c04a6d4034533  /tmp/forest-temple-heart.ogg' | sha256sum -c - \
                && echo 'fd78ebd7a17d0d3065661119bed299f7c619475b7eae004484a85bcc50a902a9  /tmp/forest-temple-path.ogg' | sha256sum -c - \
                && echo '7c242464781c044600c28bb98192155e06e50a242ffb5a1119bb17e1685543d3  /tmp/forest-temple-forest.ogg' | sha256sum -c - \
                && echo '1e74a03d24f020ca7a208a5335f1902abc3488d6fb3e46660ab2e7f12224aeeb  /tmp/forest-temple-birds.ogg' | sha256sum -c - \
                && echo '40aee4d27b0e28e6044264aefbbadd532e458b87dbea2ede05e2c8e08b89284b  /tmp/forest.ogg' | sha256sum -c - \
                && grep -q '_resetBlackoutSlider' /tmp/display.js \
                && grep -q 'openPendingWindow' /tmp/display.js \
                && grep -q 'primeScreenDetails' /tmp/display.js \
                && grep -q "window.getScreenDetails()" /tmp/display.js \
                && grep -q 'top:50%' /tmp/display.css \
                && grep -q 'translate(-50%,-50%)' /tmp/display.css; then
                if grep -Eqi "^content-security-policy:.*script-src 'self';" /tmp/player.headers \
                  && grep -Eqi "^content-security-policy:.*script-src-attr 'none';" /tmp/player.headers \
                  && grep -Eqi "^content-security-policy:.*frame-ancestors 'none';" /tmp/player.headers \
                  && grep -Eqi "^content-security-policy:.*object-src 'none';" /tmp/player.headers \
                  && grep -Eqi '^strict-transport-security:.*max-age=31536000.*includeSubDomains' /tmp/player.headers \
                  && grep -Eqi '^x-frame-options:[[:space:]]*DENY' /tmp/player.headers \
                  && grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' /tmp/player.headers \
                  && grep -Eqi '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' /tmp/player.headers \
                  && grep -Eqi '^cross-origin-opener-policy:[[:space:]]*same-origin' /tmp/player.headers \
                  && grep -Eqi '^cross-origin-resource-policy:[[:space:]]*same-origin' /tmp/player.headers \
                  && grep -Eqi '^permissions-policy:.*camera=\(\).*microphone=\(\).*geolocation=\(\)' /tmp/player.headers \
                  && grep -Eqi '^cache-control:.*no-store' /tmp/api.headers \
                  && grep -Eqi '^x-robots-tag:.*noindex.*nofollow' /tmp/api.headers; then
                  ok=1
                  break
                fi
              fi
            fi
            sleep 5
          done
          if [[ "$ok" -ne 1 ]]; then
            echo 'Production did not serve blackout display tools v4 and all Journeys within the retry window.' >&2
            echo '--- response headers ---' >&2
            cat /tmp/player.headers 2>/dev/null >&2 || true
            echo '--- API response headers ---' >&2
            cat /tmp/api.headers 2>/dev/null >&2 || true
            echo '--- player tail ---' >&2
            tail -n 30 /tmp/player.html 2>/dev/null >&2 || true
            echo '--- display JS relevant lines ---' >&2
            grep -n '_resetBlackoutSlider\|openPendingWindow\|primeScreenDetails' /tmp/display.js 2>/dev/null >&2 || true
            exit 1
          fi
          echo 'Production lullabyscene.com is serving blackout display tools v4 and all Journeys.'
