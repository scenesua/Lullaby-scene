name: Verify production web deployment

on:
  push:
    branches:
      - main
      - work/lullaby-web-foundation
    paths:
      - 'web/_worker.js'
      - 'web/display-tools-v1.js'
      - 'web/display-tools-v1.css'
      - 'web/audio-stability-v1.js'
      - 'web/visitor-count-v1.js'
      - 'web/sw.js'
      - '.github/workflows/production-web-smoke.yml'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Cloudflare production and verify current runtimes
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..36}; do
            if curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/player/?deploycheck=${GITHUB_SHA}" > /tmp/player.html \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/display-tools-v1.js?v=4&deploycheck=${GITHUB_SHA}" > /tmp/display.js \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/display-tools-v1.css?v=3&deploycheck=${GITHUB_SHA}" > /tmp/display.css \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio-stability-v1.js?v=1&deploycheck=${GITHUB_SHA}" > /tmp/audio-stability.js; then
              if grep -q 'display-tools-v1.js?v=4' /tmp/player.html \
                && grep -q 'display-tools-v1.css?v=3' /tmp/player.html \
                && grep -q 'audio-stability-v1.js?v=1' /tmp/player.html \
                && grep -q '_resetBlackoutSlider' /tmp/display.js \
                && grep -q 'openPendingWindow' /tmp/display.js \
                && grep -q 'primeScreenDetails' /tmp/display.js \
                && grep -q "window.getScreenDetails()" /tmp/display.js \
                && grep -q 'top:50%' /tmp/display.css \
                && grep -q 'translate(-50%,-50%)' /tmp/display.css \
                && grep -q 'createDynamicsCompressor' /tmp/audio-stability.js \
                && grep -q 'BACKGROUND_EVENT_MIN_MS' /tmp/audio-stability.js \
                && grep -q 'node.src.connect(node.gain)' /tmp/audio-stability.js \
                && grep -q 'document.hidden' /tmp/audio-stability.js \
                && grep -q 'mediaSession.playbackState' /tmp/audio-stability.js; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [[ "$ok" -ne 1 ]]; then
            echo 'Production did not serve the current blackout + audio stability runtimes within the retry window.' >&2
            echo '--- player tail ---' >&2
            tail -n 30 /tmp/player.html 2>/dev/null >&2 || true
            echo '--- audio stability relevant lines ---' >&2
            grep -n 'createDynamicsCompressor\|BACKGROUND_EVENT_MIN_MS\|mediaSession.playbackState' /tmp/audio-stability.js 2>/dev/null >&2 || true
            exit 1
          fi
          echo 'Production lullabyscene.com is serving blackout v4 and audio stability v1.'
