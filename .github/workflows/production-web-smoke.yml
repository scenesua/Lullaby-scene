name: Verify production web deployment

on:
  push:
    branches:
      - main
    paths:
      - 'web/_worker.js'
      - 'web/visitor-count-v1.js'
      - 'web/sw.js'
      - '.github/workflows/production-web-smoke.yml'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Cloudflare production and verify visitor v5
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..36}; do
            if curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/?deploycheck=${GITHUB_SHA}" > /tmp/root.html \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/visitor-count-v1.js?v=5&deploycheck=${GITHUB_SHA}" > /tmp/visitor.js; then
              if grep -q 'visitor-count-v1.js?v=5' /tmp/root.html \
                && grep -q 'lullaby-visitor-total-counted-v3' /tmp/visitor.js \
                && grep -q 'countapi.mileshilliard-v1' /tmp/visitor.js; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [[ "$ok" -ne 1 ]]; then
            echo 'Production did not serve visitor counter v5 within the retry window.' >&2
            echo '--- root tail ---' >&2
            tail -n 20 /tmp/root.html 2>/dev/null >&2 || true
            echo '--- visitor head ---' >&2
            head -n 20 /tmp/visitor.js 2>/dev/null >&2 || true
            exit 1
          fi
          echo 'Production is serving visitor counter v5.'
