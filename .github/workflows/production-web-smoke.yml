name: Verify production web deployment

on:
  push:
    branches:
      - main
      - work/lullaby-web-foundation
    paths:
      - 'web/_worker.js'
      - 'web/display-tools-v1.js'
      - 'web/display-tools-v1.css'
      - 'web/visitor-count-v1.js'
      - 'web/player/index.html'
      - 'web/player-v2.js'
      - 'web/train-journey-v1.js'
      - 'web/remaining-journeys-v1.js'
      - 'web/audio/scenes/**'
      - 'web/sw.js'
      - '.github/workflows/production-web-smoke.yml'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for Cloudflare production and verify blackout v4 plus all Journeys
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in {1..36}; do
            if curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/player/?deploycheck=${GITHUB_SHA}" > /tmp/player.html \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/display-tools-v1.js?v=4&deploycheck=${GITHUB_SHA}" > /tmp/display.js \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/display-tools-v1.css?v=3&deploycheck=${GITHUB_SHA}" > /tmp/display.css \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/train-journey-v1.js?v=8&deploycheck=${GITHUB_SHA}" > /tmp/train.js \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/remaining-journeys-v1.js?v=13&deploycheck=${GITHUB_SHA}" > /tmp/remaining.js \
              && curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://lullabyscene.com/journey-background-v1.js?v=13&deploycheck=${GITHUB_SHA}" > /tmp/background.js \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/assets/journeys/spacecraft.webp?deploycheck=${GITHUB_SHA}" > /tmp/spacecraft.webp \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/train_journey/train_journey_bed_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/train-bed.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/ferry_journey/ferry_journey_arrival_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/ferry.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/spacecraft_journey/spacecraft_journey_transition_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/spacecraft.ogg \
              && curl -fsS --max-time 15 -H 'Cache-Control: no-cache' "https://lullabyscene.com/audio/scenes/submarine_journey/submarine_sonar_event_001.ogg?deploycheck=${GITHUB_SHA}" > /tmp/submarine.ogg; then
              if grep -q 'display-tools-v1.js?v=4' /tmp/player.html \
                && grep -q 'display-tools-v1.css?v=3' /tmp/player.html \
                && grep -q 'train-journey-v1.js?v=8' /tmp/player.html \
                && grep -q 'remaining-journeys-v1.js?v=13' /tmp/player.html \
                && grep -q 'journey-background-v1.js?v=13' /tmp/player.html \
                && grep -q "TRAIN_ID='train_journey'" /tmp/train.js \
                && grep -q 'ferry_journey' /tmp/remaining.js \
                && grep -q 'spacecraft_journey' /tmp/remaining.js \
                && grep -q 'submarine_journey' /tmp/remaining.js \
                && grep -q 'spacecraft_journey' /tmp/background.js \
                && test "$(wc -c < /tmp/spacecraft.webp)" -gt 10000 \
                && test "$(head -c 4 /tmp/spacecraft.webp)" = 'RIFF' \
                && echo 'eb19517370cebb7921a15bd29764f16406cc442f011fa14ce01940312e743a72  /tmp/train-bed.ogg' | sha256sum -c - \
                && echo '6439ec0e9029126670bcf94b576261e0dbf40e304300b27221e6268b58a51932  /tmp/ferry.ogg' | sha256sum -c - \
                && echo 'b0eacd4243ab44f934c14884750b021dea9beb891bdf456a7b3c14ae3d1b19b0  /tmp/spacecraft.ogg' | sha256sum -c - \
                && echo '2b2c9089ce20af23fae721d5b3007c5e579f26b5f3c1623df1b9329d020c41f7  /tmp/submarine.ogg' | sha256sum -c - \
                && grep -q '_resetBlackoutSlider' /tmp/display.js \
                && grep -q 'openPendingWindow' /tmp/display.js \
                && grep -q 'primeScreenDetails' /tmp/display.js \
                && grep -q "window.getScreenDetails()" /tmp/display.js \
                && grep -q 'top:50%' /tmp/display.css \
                && grep -q 'translate(-50%,-50%)' /tmp/display.css; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          if [[ "$ok" -ne 1 ]]; then
            echo 'Production did not serve blackout display tools v4 and all Journeys within the retry window.' >&2
            echo '--- player tail ---' >&2
            tail -n 30 /tmp/player.html 2>/dev/null >&2 || true
            echo '--- display JS relevant lines ---' >&2
            grep -n '_resetBlackoutSlider\|openPendingWindow\|primeScreenDetails' /tmp/display.js 2>/dev/null >&2 || true
            exit 1
          fi
          echo 'Production lullabyscene.com is serving blackout display tools v4 and all Journeys.'
