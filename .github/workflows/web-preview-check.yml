name: Validate web player

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-preview-check.yml'
      - '.github/scripts/web-smoke.mjs'
  push:
    branches:
      - work/lullaby-web-foundation
      - work/lullaby-web-player-runtime-fix
    paths:
      - 'web/**'
      - '.github/workflows/web-preview-check.yml'
      - '.github/scripts/web-smoke.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check web/site.js
          node --check web/player-v2.js
          node --check web/player-runtime.js
          node --check web/player-settings-fix.js
          node --check web/sw.js
          node --check .github/scripts/web-smoke.mjs
      - name: Check runtime ownership and layout
        run: |
          test -s web/player/index.html
          test -s web/player-runtime.js
          test -s web/player-settings-fix.js
          test -s web/polish-v9.css
          grep -q "player-runtime.js?v=10" web/player-v2.js
          grep -q "player-settings-fix.js?v=10" web/player-v2.js
          grep -q 'data-scene-mode="journey"' web/player/index.html
          grep -q 'data-scene-mode="simple"' web/player/index.html
          grep -q 'id="durationDirect"' web/player/index.html
          grep -q 'D2Coding' web/polish-v9.css
          grep -q 'word-break:keep-all' web/polish-v9.css
          grep -q 'width:100vw' web/polish-v9.css
          grep -q "lullaby-scene-site-v12" web/sw.js
          grep -q 'Compatibility stub' web/mixer-fx-v9.js
          grep -q 'Compatibility stub' web/scene-audio-v2.js
          grep -q 'Compatibility stub' web/player-shell-v10.js
          grep -q 'Compatibility stub' web/player-controls-v11.js
      - name: Validate full mixer catalog
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('web/mixer-sources.json','utf8'));
          if(data.sources.length!==21) throw new Error(`expected 21 mixer sources, got ${data.sources.length}`);
          for(const s of data.sources){ if(!fs.existsSync('web'+s.url)) throw new Error(`missing ${s.id}: web${s.url}`); }
          NODE
      - name: Validate player runtime features
        run: |
          grep -q 'data-mini-vol' web/player-runtime.js
          grep -q 'warmthPlugin' web/player-runtime.js
          grep -q 'airPlugin' web/player-runtime.js
          grep -q 'compPlugin' web/player-runtime.js
          grep -q 'durationDirectApply' web/player-runtime.js
          grep -q 'data-timer-minutes' web/player-runtime.js
          grep -q 'themeSelect' web/player-settings-fix.js
          grep -q 'master-volume' web/player-settings-fix.js
      - name: Validate aircraft payload
        run: |
          test -s web/audio/aircraft.part00
          test -s web/audio/aircraft.part01
          test -s web/audio/aircraft.part02
          test -s web/audio/aircraft.part03
          cat web/audio/aircraft.part0{0,1,2,3} | tr -d '\n\r ' | base64 -d > /tmp/aircraft.ogg
          test "$(wc -c < /tmp/aircraft.ogg)" -eq 16630
      - name: Install browser smoke dependency
        run: npm install --no-save playwright-core@1.55.0
      - name: Browser interaction smoke test
        run: |
          python3 -m http.server 4173 --directory web >/tmp/lullaby-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/player/ >/dev/null && break; sleep 0.5; done
          node .github/scripts/web-smoke.mjs
