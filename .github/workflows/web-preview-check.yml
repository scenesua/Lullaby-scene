name: Validate web player

on:
  pull_request:
    paths:
      - 'web/**'
      - 'tools/materialize_aircraft_audio.py'
      - 'tools/resolve_freesound_preview.mjs'
      - '.github/workflows/web-preview-check.yml'
      - '.github/scripts/web-smoke.mjs'
      - '.github/scripts/web-mixer-v14-smoke.mjs'
  push:
    branches:
      - work/lullaby-web-foundation
    paths:
      - 'web/**'
      - 'tools/materialize_aircraft_audio.py'
      - 'tools/resolve_freesound_preview.mjs'
      - '.github/workflows/web-preview-check.yml'
      - '.github/scripts/web-smoke.mjs'
      - '.github/scripts/web-mixer-v14-smoke.mjs'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser dependency
        run: npm install --no-save playwright-core@1.55.0

      - name: Materialize cleaned long stereo aircraft bed
        shell: bash
        run: |
          set -euo pipefail
          TARGET='web/audio/aircraft_cabin_cruise_v2.ogg'
          if [[ ! -s "$TARGET" ]]; then
            SOURCE_URL="$(node tools/resolve_freesound_preview.mjs 853735)"
            echo "Resolved Freesound 853735 preview host: $(python3 -c 'import sys,urllib.parse;print(urllib.parse.urlparse(sys.argv[1]).netloc)' "$SOURCE_URL")"
            AIRCRAFT_SOURCE_URL="$SOURCE_URL" python3 tools/materialize_aircraft_audio.py "$TARGET"
          fi
          python3 - <<'PY'
          import json, subprocess
          path='web/audio/aircraft_cabin_cruise_v2.ogg'
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name,sample_rate,channels','-show_entries','format=duration,size','-of','json',path]))
          stream=info['streams'][0]; fmt=info['format']
          assert stream['codec_name']=='opus', info
          assert stream['sample_rate']=='48000', info
          assert int(stream['channels'])==2, info
          assert 104.8 <= float(fmt['duration']) <= 105.2, info
          assert int(fmt['size']) >= 900000, info
          print(info)
          PY

      - name: Persist aircraft bed on source branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          TARGET='web/audio/aircraft_cabin_cruise_v2.ogg'
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo 'Aircraft bed already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat(audio): materialize cleaned 853735 stereo aircraft loop'
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

      - name: Check JavaScript syntax
        run: |
          node --check web/site.js
          node --check web/player-v2.js
          node --check web/scene-audio-v2.js
          node --check web/mixer-fx-v9.js
          node --check web/player-shell-v10.js
          node --check web/player-controls-v11.js
          node --check web/player-runtime-bridge-v12.js
          node --check web/aircraft-source-v15.js
          node --check web/mixer-interaction-v14.js
          node --check web/simple-scene-quick-mixer-v12.js
          node --check web/saved-scenes-v13.js
          node --check web/scene-recipe-v1.js
          node --check web/visitor-count-v1.js
          node --check web/_worker.js
          node --check web/legal-language-v9.js
          node --check web/sw.js
          node --check tools/resolve_freesound_preview.mjs
          node --check .github/scripts/web-smoke.mjs
          node --check .github/scripts/web-mixer-v14-smoke.mjs

      - name: Check required web pages and runtimes
        run: |
          test -s web/index.html
          test -s web/player/index.html
          test -s web/download/index.html
          test -s web/privacy/index.html
          test -s web/terms/index.html
          test -s web/mixer-controls-v14.css
          test -s web/mixer-interaction-v14.js
          test -s web/aircraft-source-v15.js
          test -s web/scene-recipe-v1.js
          test -s web/audio/aircraft_cabin_cruise_v2.ogg
          grep -q 'data-scene-mode="journey"' web/player/index.html
          grep -q 'data-scene-mode="simple"' web/player/index.html
          grep -q 'id="durationDirect"' web/player/index.html
          grep -q 'data-inspector-mode="simple"' web/player/index.html
          grep -q 'data-fx="warmth"' web/player/index.html
          grep -q 'lullaby-scene-site-v17' web/sw.js
          grep -q '/audio/aircraft_cabin_cruise_v2.ogg' web/sw.js
          grep -q '/aircraft-source-v15.js?v=15' web/_worker.js
          grep -q '/mixer-interaction-v14.js?v=14' web/_worker.js
          grep -q '/mixer-controls-v14.css?v=14' web/_worker.js
          grep -q '/simple-scene-quick-mixer-v12.js?v=12' web/_worker.js
          grep -q '/saved-scenes-v13.js?v=13' web/_worker.js
          grep -q '/scene-recipe-v1.js?v=1' web/_worker.js
          ! grep -q '/mixer-zero-v13.js?v=13' web/_worker.js

      - name: Validate full mixer catalog
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('web/mixer-sources.json','utf8'));
          if(data.sources.length!==21) throw new Error(`expected 21 mixer sources, got ${data.sources.length}`);
          for(const s of data.sources){
            if(s.kind==='continuous' && !fs.existsSync('web'+s.url)) throw new Error(`missing ${s.id}: web${s.url}`);
            if(s.kind==='event' && !fs.existsSync('web'+s.url)) throw new Error(`missing event ${s.id}: web${s.url}`);
          }
          const required=['rain','thunder','wind','ocean','stream','fire','forest','birds','crickets','cafe','city','train','aircraft_cabin','fan','ventilation','water','singing_bowl','bamboo_forest','white_noise','pink_noise','brown_noise'];
          const ids=new Set(data.sources.map(s=>s.id));
          for(const id of required) if(!ids.has(id)) throw new Error(`catalog missing ${id}`);
          NODE

      - name: Validate mixer interaction and Scene Recipe wiring
        run: |
          grep -q 'desired=new Map' web/mixer-interaction-v14.js
          grep -q 'requestAnimationFrame' web/mixer-interaction-v14.js
          grep -q 'value===0' web/mixer-interaction-v14.js
          grep -q 'touch-action:pan-y' web/mixer-controls-v14.css
          grep -q '0% is Off' web/simple-scene-quick-mixer-v12.js
          grep -q 'LullabyMixerInteraction.setVolume' web/simple-scene-quick-mixer-v12.js
          grep -q 'lullaby.scene.recipe' web/scene-recipe-v1.js
          grep -q "searchParams.set('recipe'" web/scene-recipe-v1.js
          grep -q 'freesound_jasonm911_853735' web/aircraft-source-v15.js
          grep -q 'durationSeconds:105' web/aircraft-source-v15.js

      - name: Validate saved scenes, duration and FX wiring
        run: |
          grep -q 'LullabySavedScenes' web/saved-scenes-v13.js
          grep -q 'data-saved-overwrite' web/saved-scenes-v13.js
          grep -q "fixedDurations:\[360,480,600\]" web/player-controls-v11.js
          grep -q "sliderMinMinutes:1" web/player-controls-v11.js
          grep -q "LullabyControls" web/player-controls-v11.js
          grep -q "createDynamicsCompressor" web/mixer-fx-v9.js
          grep -q "createConvolver" web/mixer-fx-v9.js

      - name: Validate aircraft sleep-journey processing chain
        run: |
          ! grep -q 'createStereoPanner' web/scene-audio-v2.js
          ! grep -q '/audio/ventilation.ogg' web/scene-audio-v2.js
          ! grep -q '/audio/brown_noise.ogg' web/scene-audio-v2.js
          grep -q 'LullabyJourneyRuntime' web/scene-audio-v2.js
          grep -q 'setPointerCapture' web/scene-audio-v2.js
          grep -q 'equalizer=f=10544' tools/materialize_aircraft_audio.py
          grep -q 'equalizer=f=3574' tools/materialize_aircraft_audio.py
          ! grep -q 'loudnorm' tools/materialize_aircraft_audio.py
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration,size -of json web/audio/aircraft_cabin_cruise_v2.ogg

      - name: Browser interaction smoke tests
        run: |
          python3 -m http.server 4173 --directory web >/tmp/lullaby-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/player/ >/dev/null && break; sleep 0.5; done
          node .github/scripts/web-smoke.mjs
          node .github/scripts/web-mixer-v14-smoke.mjs
