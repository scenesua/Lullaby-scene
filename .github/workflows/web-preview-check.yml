name: Validate web player

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-preview-check.yml'
  push:
    branches:
      - work/lullaby-web-foundation
    paths:
      - 'web/**'
      - '.github/workflows/web-preview-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check web/site.js && node --check web/player-v2.js && node --check web/player-ui.js && node --check web/duration-input.js && node --check web/sw.js
      - name: Check required web pages and files
        run: |
          test -s web/index.html
          test -s web/player/index.html
          test -s web/download/index.html
          test -s web/styles.css
          test -s web/site-shell.css
          test -s web/player-v2.css
          test -s web/player-v2.js
          test -s web/player-ui.js
          test -s web/duration-input.js
          test -s web/mixer-sources.json
          test -s web/manifest.webmanifest
          test -s web/_headers
          grep -q 'href="/player/"' web/index.html
          grep -q 'data-scene-mode="journey"' web/player/index.html
          grep -q 'data-scene-mode="simple"' web/player/index.html
          ! grep -q 'class="web-player"' web/index.html
          grep -q 'data-pwa-install' web/download/index.html
          grep -q 'language-toggle' web/index.html
          grep -q 'language-toggle' web/player/index.html
          grep -q '"start_url": "/player/"' web/manifest.webmanifest
          grep -q "media-src 'self' blob:" web/_headers
      - name: Validate full mixer catalog
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('web/mixer-sources.json','utf8'));
          if(data.sources.length!==21) throw new Error(`expected 21 mixer sources, got ${data.sources.length}`);
          for(const s of data.sources){
            if(s.kind==='continuous' && !fs.existsSync('web'+s.url)) throw new Error(`missing ${s.id}: web${s.url}`);
            if(s.kind==='event' && !fs.existsSync('web'+s.url)) throw new Error(`missing event ${s.id}: web${s.url}`);
          }
          const required=['rain','thunder','wind','ocean','stream','fire','forest','birds','crickets','cafe','city','train','aircraft_cabin','fan','ventilation','water','singing_bowl','bamboo_forest','white_noise','pink_noise','brown_noise'];
          const ids=new Set(data.sources.map(s=>s.id));
          for(const id of required) if(!ids.has(id)) throw new Error(`catalog missing ${id}`);
          NODE
      - name: Validate direct duration limits
        run: |
          grep -q 'MIN_MINUTES=240' web/duration-input.js
          grep -q 'MAX_MINUTES=720' web/duration-input.js
          grep -q '04:00~12:00' web/duration-input.js
      - name: Validate language dictionaries
        run: |
          grep -q "sleepJourneys:'잠의 여정'" web/site.js
          grep -q "simpleScenes:'심플 씬'" web/site.js
          grep -q "sleepJourneys:'Sleep Journeys'" web/site.js
          grep -q "simpleScenes:'Simple Scenes'" web/site.js
      - name: Validate aircraft payload
        run: |
          test -s web/audio/aircraft.part00
          test -s web/audio/aircraft.part01
          test -s web/audio/aircraft.part02
          test -s web/audio/aircraft.part03
          cat web/audio/aircraft.part0{0,1,2,3} | tr -d '\n\r ' | base64 -d > /tmp/aircraft.ogg
          test "$(wc -c < /tmp/aircraft.ogg)" -eq 16630
