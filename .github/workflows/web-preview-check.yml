name: Validate web player

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-preview-check.yml'
      - '.github/scripts/web-smoke.mjs'
  push:
    branches:
      - work/lullaby-web-foundation
    paths:
      - 'web/**'
      - '.github/workflows/web-preview-check.yml'
      - '.github/scripts/web-smoke.mjs'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check web/site.js
          node --check web/player-v2.js
          node --check web/scene-audio-v2.js
          node --check web/mixer-fx-v9.js
          node --check web/player-shell-v9.js
          node --check web/player-shell-v10.js
          node --check web/player-controls-v11.js
          node --check web/legal-language-v9.js
          node --check web/sw.js
          node --check .github/scripts/web-smoke.mjs
      - name: Check required web pages and files
        run: |
          test -s web/index.html
          test -s web/player/index.html
          test -s web/download/index.html
          test -s web/privacy/index.html
          test -s web/terms/index.html
          test -s web/styles.css
          test -s web/site-shell.css
          test -s web/polish-v9.css
          test -s web/player-v2.css
          test -s web/player-v2.js
          test -s web/scene-audio-v2.js
          test -s web/mixer-fx-v9.js
          test -s web/player-shell-v10.js
          test -s web/player-controls-v11.js
          test -s web/mixer-sources.json
          test -s web/manifest.webmanifest
          test -s web/_headers
          grep -q 'href="/player/"' web/index.html
          grep -q 'data-scene-mode="journey"' web/player/index.html
          grep -q 'data-scene-mode="simple"' web/player/index.html
          grep -q 'id="durationDirect"' web/player/index.html
          grep -q 'data-inspector-mode="simple"' web/player/index.html
          grep -q 'data-fx="warmth"' web/player/index.html
          grep -q '/mixer-fx-v9.js' web/player/index.html
          grep -q '/player-shell-v10.js' web/player/index.html
          grep -q '/player-controls-v11.js' web/player/index.html
          ! grep -q '/player-shell-v9.js' web/player/index.html
          ! grep -q 'class="web-player"' web/index.html
          grep -q 'data-pwa-install' web/download/index.html
          grep -q 'language-toggle' web/index.html
          grep -q 'language-toggle' web/player/index.html
          grep -q 'language-toggle' web/privacy/index.html
          grep -q '"start_url": "/player/"' web/manifest.webmanifest
          grep -q "media-src 'self' blob:" web/_headers
          grep -q "lullaby-scene-site-v11" web/sw.js
      - name: Validate full mixer catalog
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('web/mixer-sources.json','utf8'));
          if(data.sources.length!==21) throw new Error(`expected 21 mixer sources, got ${data.sources.length}`);
          for(const s of data.sources){
            if(s.kind==='continuous' && !fs.existsSync('web'+s.url)) throw new Error(`missing ${s.id}: web${s.url}`);
            if(s.kind==='event' && !fs.existsSync('web'+s.url)) throw new Error(`missing event ${s.id}: web${s.url}`);
          }
          const required=['rain','thunder','wind','ocean','stream','fire','forest','birds','crickets','cafe','city','train','aircraft_cabin','fan','ventilation','water','singing_bowl','bamboo_forest','white_noise','pink_noise','brown_noise'];
          const ids=new Set(data.sources.map(s=>s.id));
          for(const id of required) if(!ids.has(id)) throw new Error(`catalog missing ${id}`);
          NODE
      - name: Validate duration and Scene FX wiring
        run: |
          grep -q "n>=240&&n<=720" web/player-shell-v10.js
          grep -q "LullabyControls" web/player-controls-v11.js
          grep -q "data-duration" web/player-controls-v11.js
          grep -q "durationDirectApply" web/player-controls-v11.js
          grep -q "data-macro" web/player-controls-v11.js
          grep -q "warmth" web/mixer-fx-v9.js
          grep -q "createDynamicsCompressor" web/mixer-fx-v9.js
          grep -q "createConvolver" web/mixer-fx-v9.js
          grep -q "makeSourceNode=async" web/mixer-fx-v9.js
      - name: Validate language and typography
        run: |
          grep -q "sleepJourneys:'잠의 여정'" web/site.js
          grep -q "simpleScenes:'심플 씬'" web/site.js
          grep -q "sleepJourneys:'Sleep Journeys'" web/site.js
          grep -q "simpleScenes:'Simple Scenes'" web/site.js
          grep -q 'word-break:keep-all' web/polish-v9.css
          grep -q 'D2Coding' web/polish-v9.css
          grep -q 'data-lang-block="en"' web/privacy/index.html
          grep -q 'data-lang-block="en"' web/terms/index.html
      - name: Validate aircraft sleep-journey layers
        run: |
          grep -q "/audio/ventilation.ogg" web/scene-audio-v2.js
          grep -q "/audio/brown_noise.ogg" web/scene-audio-v2.js
          grep -q 'phaseVent' web/scene-audio-v2.js
          grep -q 'phaseRumble' web/scene-audio-v2.js
      - name: Validate aircraft payload
        run: |
          test -s web/audio/aircraft.part00
          test -s web/audio/aircraft.part01
          test -s web/audio/aircraft.part02
          test -s web/audio/aircraft.part03
          cat web/audio/aircraft.part0{0,1,2,3} | tr -d '\n\r ' | base64 -d > /tmp/aircraft.ogg
          test "$(wc -c < /tmp/aircraft.ogg)" -eq 16630
      - name: Install browser smoke dependency
        run: npm install --no-save playwright-core@1.55.0
      - name: Browser interaction smoke test
        run: |
          python3 -m http.server 4173 --directory web >/tmp/lullaby-web.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/player/ >/dev/null && break; sleep 0.5; done
          node .github/scripts/web-smoke.mjs
