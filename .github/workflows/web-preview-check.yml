name: Validate web player

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'tools/materialize_aircraft_audio.py'
      - 'tools/materialize_aircraft_taxi.py'
      - 'tools/materialize_train_journey.py'
      - 'tools/materialize_remaining_journeys.py'
      - 'tools/materialize_unused_mixer_sources.py'
      - 'app/src/main/assets/ambience/lighthouse/**'
      - 'app/src/main/assets/ambience/snowy_night/**'
      - 'app/src/main/assets/ambience/manifest/sound_library.json'
      - 'app/src/main/assets/ambience/*_journey/**'
      - 'app/src/main/assets/ambience/manifest/scene_sources.json'
      - 'app/src/main/java/com/scene/ambience/media/TrainJourneyTimeline.kt'
      - 'app/src/main/java/com/scene/ambience/media/AmbientJourneyTimeline.kt'
      - 'tools/resolve_freesound_preview.mjs'
      - 'WEB_REQUIREMENTS_STATUS.md'
      - '.github/workflows/web-preview-check.yml'
      - '.github/scripts/web-smoke.mjs'
      - '.github/scripts/web-mixer-v14-smoke.mjs'
      - '.github/scripts/web-visitor-fallback-smoke.mjs'
      - '.github/scripts/train-journey-parity-smoke.mjs'
      - '.github/scripts/web-train-journey-smoke.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install browser dependency
        run: npm install --no-save playwright-core@1.55.0

      - name: Verify committed aircraft beds
        shell: bash
        run: |
          set -euo pipefail
          CRUISE='web/audio/aircraft_cabin_cruise_v2.ogg'
          test -s "$CRUISE"
          test "$(wc -c < "$CRUISE")" -eq 1166883
          echo 'd6b065bd63b2ba586bff79841f23b150aea96bcd84d7c9649ef9713cd9b6d29c  web/audio/aircraft_cabin_cruise_v2.ogg' | sha256sum -c -
          if [[ -f web/audio/aircraft_cabin_taxi_627056_v1.ogg ]]; then
            TAXI='web/audio/aircraft_cabin_taxi_627056_v1.ogg'
            test "$(wc -c < "$TAXI")" -eq 2246931
            echo '3d9fe5fb05e4b197b88a11754a107095a4779b321f8afeb6760f4ac3a79b5b2a  web/audio/aircraft_cabin_taxi_627056_v1.ogg' | sha256sum -c -
          fi

      - name: Check JavaScript syntax
        run: |
          node --check web/site.js
          node --check web/player-v2.js
          node --check web/scene-audio-v2.js
          node --check web/train-journey-v1.js
          node --check web/remaining-journeys-v1.js
          node --check web/mixer-fx-v9.js
          node --check web/player-shell-v10.js
          node --check web/player-controls-v11.js
          node --check web/player-runtime-bridge-v12.js
          node --check web/aircraft-source-v15.js
          node --check web/mixer-interaction-v14.js
          node --check web/simple-scene-quick-mixer-v12.js
          node --check web/saved-scenes-v13.js
          node --check web/scene-recipe-v1.js
          node --check web/visitor-count-v1.js
          node --check web/_worker.js
          node --check web/legal-language-v9.js
          node --check web/sw.js
          node --check tools/resolve_freesound_preview.mjs
          node --check .github/scripts/web-smoke.mjs
          node --check .github/scripts/web-mixer-v14-smoke.mjs
          node --check .github/scripts/web-visitor-fallback-smoke.mjs
          node --check .github/scripts/train-journey-parity-smoke.mjs
          node --check .github/scripts/web-train-journey-smoke.mjs

      - name: Validate all Journey Android and Web parity
        run: node .github/scripts/train-journey-parity-smoke.mjs

      - name: Check required web pages and runtimes
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/player/index.html
          test -s web/download/index.html
          test -s web/privacy/index.html
          test -s web/terms/index.html
          test -s web/mixer-controls-v14.css
          test -s web/mixer-interaction-v14.js
          test -s web/aircraft-source-v15.js
          test -s web/scene-recipe-v1.js
          test -s web/train-journey-v1.js
          test -s web/remaining-journeys-v1.js
          test -s web/audio/scenes/train_journey/train_journey_departure_001.ogg
          test -s web/audio/scenes/train_journey/train_journey_bed_001.ogg
          test -s web/audio/scenes/train_journey/train_journey_arrival_001.ogg
          test -s web/audio/aircraft_cabin_cruise_v2.ogg
          grep -q 'data-scene-mode="journey"' web/player/index.html
          grep -q 'data-scene-mode="simple"' web/player/index.html
          grep -q 'id="durationDirect"' web/player/index.html
          grep -q 'data-inspector-mode="simple"' web/player/index.html
          grep -q 'data-fx="warmth"' web/player/index.html
          grep -q '/visitor-count-v1.js?v=9' web/sw.js
          grep -q '/visitor-count-v1.js?v=9' web/player/index.html
          grep -q 'api.counterapi.dev/v1' web/visitor-count-v1.js
          grep -q 'lullaby-scene-site-v89' web/sw.js
          grep -q "event.request.destination==='audio'" web/sw.js
          grep -q "url.pathname.startsWith('/api/')" web/sw.js
          ! sed -n '3p' web/sw.js | grep -q '/audio/'
          grep -q '/player-v2.js?v=21' web/sw.js
          grep -q '/scene-audio-v2.js?v=17' web/sw.js
          grep -q '/train-journey-v1.js?v=13' web/sw.js
          grep -q '/remaining-journeys-v1.js?v=29' web/sw.js
          grep -q '/journey-background-v1.js?v=16' web/sw.js
          test -s web/assets/journeys/spacecraft.webp
          test -s web/assets/journeys/submarine.webp
          test -s web/assets/journeys/forest-temple.webp
          grep -q '/aircraft-source-v15.js?v=15' web/player/index.html
          grep -q '/mixer-interaction-v14.js?v=19' web/player/index.html
          grep -q '/mixer-controls-v14.css?v=18' web/player/index.html
          grep -q '/simple-scene-quick-mixer-v12.js?v=15' web/player/index.html
          grep -q '/saved-scenes-v13.js?v=15' web/player/index.html
          grep -q '/scene-recipe-v1.js?v=3' web/player/index.html
          ! grep -q '/mixer-zero-v13.js?v=13' web/player/index.html
          test -s web/audio/aircraft_cabin_taxi_627056_v1.ogg
          grep -q 'freesound_mar_sounds_627056' web/aircraft-source-v15.js

      - name: Validate full mixer catalog
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const data=JSON.parse(fs.readFileSync('web/mixer-sources.json','utf8'));
          const webPath=url=>'web'+url.split('?')[0];
          const digest=path=>crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          if(data.sources.length!==54) throw new Error(`expected 54 mixer sources, got ${data.sources.length}`);
          for(const s of data.sources){
            if(s.kind==='continuous' && !fs.existsSync(webPath(s.url))) throw new Error(`missing ${s.id}: ${webPath(s.url)}`);
            if(s.kind==='event' && !fs.existsSync(webPath(s.url))) throw new Error(`missing event ${s.id}: ${webPath(s.url)}`);
          }
          const required=['rain','thunder','wind','ocean','stream','fire','forest','birds','crickets','snowy_night','cafe','city','train','lighthouse','aircraft_cabin','fan','ventilation','water','singing_bowl','bamboo_forest','white_noise','pink_noise','brown_noise'];
          const ids=new Set(data.sources.map(s=>s.id));
          for(const id of required) if(!ids.has(id)) throw new Error(`catalog missing ${id}`);
          const android=JSON.parse(fs.readFileSync('app/src/main/assets/ambience/manifest/sound_library.json','utf8'));
          for(const id of ['lighthouse','snowy_night']){
            const source=android.sources.find(s=>s.id===id),web=data.sources.find(s=>s.id===id);
            if(!source||!web) throw new Error(`platform catalog missing ${id}`);
            const androidPath='app/src/main/assets/'+source.continuous[0].path;
            if(digest(androidPath)!==digest(webPath(web.url))) throw new Error(`${id} Android/Web asset mismatch`);
          }
          const scenes=JSON.parse(fs.readFileSync('app/src/main/assets/ambience/manifest/scene_sources.json','utf8'));
          const internalJourneySources=new Set(['forest_temple_bamboo_bed','forest_temple_korean_birds_bed','forest_temple_bowl','forest_temple_heart_sutra_event']);
          for(const source of scenes.sources.filter(s=>s.id!=='aircraft_cabin'&&!internalJourneySources.has(s.id))){
            const web=data.sources.find(s=>s.id===source.id),asset=source.continuous[0]||source.events[0];
            if(!web||!asset) throw new Error(`Journey mixer source missing ${source.id}`);
            const androidPath='app/src/main/assets/'+asset.path;
            if(!fs.existsSync(androidPath)||!fs.existsSync(webPath(web.url))) throw new Error(`${source.id} platform asset missing`);
            // HOOD one-shots have a shorter mono Android copy so SoundPool stays
            // below its decoded-sample limit; the web keeps its longer stereo copy.
            if(source.loop_mode==='event'&&source.id.startsWith('hood_')) continue;
            if(digest(androidPath)!==digest(webPath(web.url))) throw new Error(`${source.id} Journey mixer asset mismatch`);
          }
          NODE

      - name: Validate mixer interaction and Scene Recipe wiring
        run: |
          grep -q 'desired=new Map' web/mixer-interaction-v14.js
          grep -q 'requestAnimationFrame' web/mixer-interaction-v14.js
          grep -q 'value===0' web/mixer-interaction-v14.js
          grep -q 'touch-action:pan-y' web/mixer-controls-v14.css
          grep -q '0% is Off' web/simple-scene-quick-mixer-v12.js
          grep -q 'LullabyMixerInteraction.setVolume' web/simple-scene-quick-mixer-v12.js
          grep -q 'lullaby.scene.recipe' web/scene-recipe-v1.js
          grep -q "searchParams.set('recipe'" web/scene-recipe-v1.js
          grep -q 'freesound_jasonm911_853735' web/aircraft-source-v15.js
          grep -q 'durationSeconds:105' web/aircraft-source-v15.js

      - name: Validate saved scenes, duration and FX wiring
        run: |
          grep -q 'LullabySavedScenes' web/saved-scenes-v13.js
          grep -q 'data-saved-overwrite' web/saved-scenes-v13.js
          grep -q "fixedDurations:\[360,480,600\]" web/player-controls-v11.js
          grep -q "sliderMinMinutes:1" web/player-controls-v11.js
          grep -q "LullabyControls" web/player-controls-v11.js
          grep -q "createDynamicsCompressor" web/mixer-fx-v9.js
          grep -q "createConvolver" web/mixer-fx-v9.js

      - name: Validate aircraft sleep-journey processing chain
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'createStereoPanner' web/scene-audio-v2.js
          ! grep -q '/audio/ventilation.ogg' web/scene-audio-v2.js
          ! grep -q '/audio/brown_noise.ogg' web/scene-audio-v2.js
          grep -q 'LullabyJourneyRuntime' web/scene-audio-v2.js
          grep -q 'setPointerCapture' web/scene-audio-v2.js
          grep -q 'journeyPrevPhase' web/scene-audio-v2.js
          grep -q 'journeyNextPhase' web/scene-audio-v2.js
          grep -q 'equalizer=f=10544' tools/materialize_aircraft_audio.py
          grep -q 'equalizer=f=3574' tools/materialize_aircraft_audio.py
          ! grep -q 'loudnorm=' tools/materialize_aircraft_audio.py
          if [[ -f web/audio/aircraft_cabin_taxi_627056_v1.ogg ]]; then
            grep -q 'const specs=\[\[685,5,-6\]' web/scene-audio-v2.js
            grep -q 'ensureTaxiNode' web/scene-audio-v2.js
            grep -q 'getAircraftTaxiUrl' web/scene-audio-v2.js
            grep -q 'LullabyJourneyAudio' web/scene-audio-v2.js
            grep -q 'bridgeMs:180' web/aircraft-source-v15.js
            grep -q 'stable 50..230 s body' tools/materialize_aircraft_taxi.py
            ! grep -q 'loudnorm' tools/materialize_aircraft_taxi.py
          else
            grep -q 'tone685.frequency.value=685' web/scene-audio-v2.js
            grep -q 'tone1191.frequency.value=1191' web/scene-audio-v2.js
            grep -q 'tone2383.frequency.value=2383' web/scene-audio-v2.js
            grep -q 'tone3574.frequency.value=3574' web/scene-audio-v2.js
            grep -q 'tone10544.frequency.value=10544' web/scene-audio-v2.js
          fi

      - name: Browser primary smoke
        timeout-minutes: 2
        run: |
          python3 -m http.server 4173 --directory web >/tmp/lullaby-web-primary.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/player/ >/dev/null && break; sleep 0.5; done
          timeout 90s node .github/scripts/web-smoke.mjs
          timeout 90s node .github/scripts/web-uiux-smoke.mjs
          timeout 90s node .github/scripts/web-preset-picker-smoke.mjs
          node .github/scripts/web-debug-smoke.mjs

      - name: Browser Mixer and journey seek smoke
        timeout-minutes: 2
        run: |
          python3 -m http.server 4173 --directory web >/tmp/lullaby-web-mixer.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/player/ >/dev/null && break; sleep 0.5; done
          timeout 90s node .github/scripts/web-mixer-v14-smoke.mjs

      - name: Browser Train Journey smoke
        timeout-minutes: 2
        run: |
          python3 -m http.server 4173 --directory web >/tmp/lullaby-web-train.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/player/ >/dev/null && break; sleep 0.5; done
          timeout 90s node .github/scripts/web-train-journey-smoke.mjs

      - name: Browser static visitor fallback smoke
        timeout-minutes: 2
        run: |
          python3 -m http.server 4173 --directory web >/tmp/lullaby-web-visitors.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.5; done
          timeout 90s node .github/scripts/web-visitor-fallback-smoke.mjs
