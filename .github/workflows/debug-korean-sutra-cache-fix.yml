name: One-shot debug Korean sutra cache fix

on:
  push:
    branches: [debug]
    paths:
      - '.github/workflows/debug-korean-sutra-cache-fix.yml'

permissions:
  contents: write

jobs:
  patch-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: debug
      - name: Patch debug labels and cache keys
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, got {count}')
              if count == 0:
                  raise SystemExit(f'{path}: missing {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: {old!r} -> {new!r} ({count})')

          replace('web/site-locales-v10.js', "forest_temple_heart_sutra:'반야심경 · 중국어'", "forest_temple_heart_sutra:'반야심경 · 한국어 독송'", 1)
          replace('web/site-locales-v10.js', "forest_temple_moktak:'Rhythmic Rhythmic Temple Moktak'", "forest_temple_moktak:'Rhythmic Temple Moktak'", 1)
          replace('web/player/index.html', '/site-locales-v10.js?v=19', '/site-locales-v10.js?v=20', 1)
          replace('web/player/index.html', '/debug-bridge-v1.js?v=3', '/debug-bridge-v1.js?v=4', 1)
          replace('web/debug/index.html', '/debug-console-v1.js?v=3', '/debug-console-v1.js?v=4', 1)
          replace('web/sw.js', "const CACHE='lullaby-scene-debug-v12'", "const CACHE='lullaby-scene-debug-v13'", 1)
          replace('web/sw.js', '/site-locales-v10.js?v=19', '/site-locales-v10.js?v=20', 1)
          replace('web/sw.js', '/debug-console-v1.js?v=3', '/debug-console-v1.js?v=4', 1)
          replace('web/sw.js', '/debug-bridge-v1.js?v=3', '/debug-bridge-v1.js?v=4', 1)
      - name: Verify debug wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F "forest_temple_heart_sutra:'반야심경 · 한국어 독송'" web/site-locales-v10.js
          grep -F '/debug-bridge-v1.js?v=4' web/player/index.html
          grep -F '/debug-console-v1.js?v=4' web/debug/index.html
          grep -F "lullaby-scene-debug-v13" web/sw.js
          grep -F '2.8s reverb + subtle echo' web/debug-bridge-v1.js
          ! grep -F '반야심경 · 중국어' web/site-locales-v10.js
      - name: Commit debug-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/site-locales-v10.js web/player/index.html web/debug/index.html web/sw.js
          git commit -m 'Fix Korean Heart Sutra debug cache wiring'
          git push origin HEAD:debug
