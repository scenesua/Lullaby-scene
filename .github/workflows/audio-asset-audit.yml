name: Import and audit audio assets

on:
  workflow_dispatch:
  push:
    branches:
      - work/lullaby-2.0-audio-foundation
    paths:
      - "app/src/main/assets/ambience/**"
      - "tools/import_verified_audio_assets.py"
      - "tools/audit_audio_assets.py"
      - ".github/workflows/audio-asset-audit.yml"

permissions:
  contents: write

jobs:
  import-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Import pinned public-domain assets
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[audio-import]')
        run: python tools/import_verified_audio_assets.py
      - name: Audit packaged audio
        run: python tools/audit_audio_assets.py
      - name: Commit generated assets and provenance
        if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[audio-import]')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/ambience
          if ! git diff --cached --quiet; then
            git commit -m "chore: import verified ambience assets [audio-import]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: audio-audit-${{ github.sha }}
          path: build/audio-audit/
          if-no-files-found: error
          retention-days: 14
