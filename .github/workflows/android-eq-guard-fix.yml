name: Stage source-aware aircraft whistle guard

on:
  push:
    branches: [work/lullaby-2.0-audio-foundation]
    paths: ['.github/workflows/android-eq-guard-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lullaby-2.0-audio-foundation
          fetch-depth: 0
      - name: Apply source-aware EQ guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing pattern in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          p='app/src/main/java/com/scene/ambience/media/AmbienceEngine.kt'
          patch(p,
            '        synchronized(fxLock) { equalizers.values.toList() }.forEach { applyEqTo(it) }\n',
            '        synchronized(fxLock) { equalizers.toMap() }.forEach { (sessionId, effect) -> applyEqTo(effect, sessionSources[sessionId]) }\n')
          patch(p,
            '        if (eq != null) applyEqTo(eq)\n',
            '        if (eq != null) applyEqTo(eq, synchronized(fxLock) { sessionSources[sessionId] })\n')
          patch(p,
            '    private fun applyEqTo(eq: Equalizer) {\n        try {\n            val fx = fxSettings\n            val toneActive = fx.enabled && (fx.warmth > 0.001f || fx.air > 0.001f)\n            val shouldEnable = eqEnabled || toneActive\n',
            '    private fun applyEqTo(eq: Equalizer, sourceId: String? = null) {\n        try {\n            val fx = fxSettings\n            val toneActive = fx.enabled && (fx.warmth > 0.001f || fx.air > 0.001f)\n            val aircraftGuardActive = sourceId == "aircraft_cabin"\n            val shouldEnable = eqEnabled || toneActive || aircraftGuardActive\n')
          patch(p,
            '''                val airMb = if (fx.enabled) when {\n                    hz >= 7000f -> (fx.air * 220f).roundToInt()\n                    hz >= 3500f -> (fx.air * 100f).roundToInt()\n                    else -> 0\n                } else 0\n                val level = (base + warmthMb + airMb)\n''',
            '''                val airMb = if (fx.enabled) when {\n                    hz >= 7000f -> (fx.air * 220f).roundToInt()\n                    hz >= 3500f -> (fx.air * 100f).roundToInt()\n                    else -> 0\n                } else 0\n                // The original aircraft recording has stable narrow tonal ridges\n                // around 0.685, 1.191, 2.383, 3.574 and 10.54 kHz. Android's\n                // platform Equalizer is coarse, so attenuate only the real device\n                // bands whose center frequencies cover those ridges.\n                val aircraftGuardMb = if (aircraftGuardActive) when {\n                    hz in 500f..899f -> -300\n                    hz in 900f..1599f -> -450\n                    hz in 1600f..2999f -> -300\n                    hz in 3000f..4999f -> -600\n                    hz >= 8000f -> -650\n                    else -> 0\n                } else 0\n                val level = (base + warmthMb + airMb + aircraftGuardMb)\n''')

          # Avoid stacking a second coarse guard from the scene scheduler. Night
          # softening remains, while the source-aware per-session guard above owns
          # the persistent whistle suppression.
          p='app/src/main/java/com/scene/ambience/media/SceneOrchestrator.kt'
          patch(p,
            '''        val highSoftening = (80f * macros.nightDepth + 35f * (1f - macros.enginePresence)).toInt()\n        // Taxi has no journey event audio, yet the whistle is audible there. Keep a\n        // source-specific safety cut on the two upper EQ regions for the entire\n        // aircraft scene instead of trying to hide it with broadband denoise.\n        val whistleGuardPresenceMb = 420\n        val whistleGuardUpperMb = 650\n        bands[0] = (bands[0] + lowBody).coerceIn(-1500, 1500)\n        if (count >= 2) bands[count - 2] = (bands[count - 2] - whistleGuardPresenceMb - highSoftening / 2).coerceIn(-1500, 1500)\n        bands[count - 1] = (bands[count - 1] - whistleGuardUpperMb - highSoftening).coerceIn(-1500, 1500)\n''',
            '''        val highSoftening = (80f * macros.nightDepth + 35f * (1f - macros.enginePresence)).toInt()\n        // Persistent aircraft whistle suppression is source-aware in AmbienceEngine.\n        // Keep the scene scheduler limited to the very small user-controlled tone\n        // changes so it does not double-cut the cabin recording.\n        bands[0] = (bands[0] + lowBody).coerceIn(-1500, 1500)\n        if (count >= 2) bands[count - 2] = (bands[count - 2] - highSoftening / 2).coerceIn(-1500, 1500)\n        bands[count - 1] = (bands[count - 1] - highSoftening).coerceIn(-1500, 1500)\n''')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/scene/ambience/media/AmbienceEngine.kt app/src/main/java/com/scene/ambience/media/SceneOrchestrator.kt
          git commit -m 'fix(android): make aircraft whistle guard source-aware'
          git push origin HEAD:work/lullaby-2.0-audio-foundation
