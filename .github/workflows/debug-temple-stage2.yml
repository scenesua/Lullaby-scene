name: Forest Temple debug build 2
on:
  push:
    branches:
      - debug
    paths:
      - .github/workflows/debug-temple-stage2.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: debug
          fetch-depth: 0
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg >/dev/null
      - name: Prepare build 2
        run: python3 tools/debug_build2.py
      - name: Validate build 2
        run: |
          node --check web/remaining-journeys-v1.js
          grep -Fq 'forest_temple_bamboo_wide_bed_001.ogg?v=1' web/remaining-journeys-v1.js
          grep -Fq 'gains:{departure:1,forest:.152,bowl:.227}' web/remaining-journeys-v1.js
          grep -Fq 'entered&&stage===2&&scenePlaying' web/remaining-journeys-v1.js
          grep -Fq 'DEBUG_BUILD:2' web/debug/index.html
      - name: Commit build 2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/debug-analyze-temple-walk.yml .github/workflows/debug-temple-stage2.yml tools/debug_build2.py
          git add web/audio/scenes/forest_temple_journey/forest_temple_bamboo_wide_bed_001.ogg web/remaining-journeys-v1.js web/player/index.html web/sw.js web/debug/index.html
          git commit -m 'Forest Temple debug build 2: stage audio and sutra cue'
          git fetch origin debug
          git rebase origin/debug
          git push origin HEAD:debug
