name: Tune Forest Temple debug stages

on:
  push:
    branches:
      - debug
    paths:
      - '.github/workflows/debug-forest-temple-stage-tune.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out debug
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: debug
          fetch-depth: 0

      - name: Tune Forest Temple staging and distance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]}')
              p.write_text(s.replace(old,new))

          path='web/remaining-journeys-v1.js'
          replace(path,
              "roles:{departure:['departure'],bed:['forest','bowl'],arrival:['forest','bowl']},gains:{departure:.34,forest:.34,bowl:.09},bedStartsAtPhaseBoundary:true,event:{sequence:'temple',label:['Temple sound','절의 소리'],minMs:210000,maxMs:540000,phases:[1,2,3]",
              "roles:{departure:['departure','forest'],bed:['forest','bowl'],arrival:['forest','bowl']},gains:{departure:.34,forest:.34,bowl:.09},bedStartsAtPhaseBoundary:true,event:{sequence:'temple',label:['Temple sound','절의 소리'],minMs:210000,maxMs:540000,phases:[2,3]")
          replace(path,"panner.pan.value=.48;node.panner=panner","panner.pan.value=0;node.panner=panner")
          replace(path,"if(node.panner&&key==='bowl')node.panner.pan.setTargetAtTime(.48,ctx.currentTime,1.2)","if(node.panner&&key==='bowl')node.panner.pan.setTargetAtTime(0,ctx.currentTime,1.2)")
          replace(path,
              "if(previous&&previous!==role)for(const key of cfg.roles[previous]){const old=nodes[key];old?.gain.gain.setTargetAtTime(0,ctx.currentTime,fadeSeconds/3);setTimeout(()=>{if(!cfg.roles[audibleRole]?.includes(key))old?.el.pause()},fadeSeconds*1000)}",
              "if(previous&&previous!==role)for(const key of cfg.roles[previous]){if(cfg.roles[role]?.includes(key))continue;const old=nodes[key];old?.gain.gain.setTargetAtTime(0,ctx.currentTime,fadeSeconds/3);setTimeout(()=>{if(!cfg.roles[audibleRole]?.includes(key))old?.el.pause()},fadeSeconds*1000)}")
          replace(path,
              "for(const key of cfg.roles[role]){const node=nodes[key];node.el.preload='auto';try{node.el.currentTime=offset(key,role,ms,total,cfg)}catch{}await node.el.play();if(generation!==roleGeneration&&!cfg.roles[audibleRole]?.includes(key))node.el.pause()}",
              "for(const key of cfg.roles[role]){const node=nodes[key];if(previous&&cfg.roles[previous]?.includes(key)&&!node.el.paused)continue;node.el.preload='auto';try{node.el.currentTime=offset(key,role,ms,total,cfg)}catch{}await node.el.play();if(generation!==roleGeneration&&!cfg.roles[audibleRole]?.includes(key))node.el.pause()}")
          replace(path,"sutra?6500:type==='gravel'?5200:7200","sutra?5900:type==='gravel'?5200:7200")
          replace(path,"sutra?.11:type==='gravel'?.075:.09","sutra?.09:type==='gravel'?.075:.09")
          replace(path,"sutra?6800:picked==='gravel'?5200:7200","sutra?6100:picked==='gravel'?5200:7200")
          replace(path,"sutra?.18:picked==='gravel'?.075:.09","sutra?.14:picked==='gravel'?.075:.09")

          bridge='web/debug-bridge-v1.js'
          replace(bridge,"reverbTone.frequency.value=5600","reverbTone.frequency.value=5000")
          replace(bridge,"reverbWet.gain.value=.34","reverbWet.gain.value=.50")
          replace(bridge,"panner.pan.value=.48;node.panner=panner","panner.pan.value=0;node.panner=panner")
          replace(bridge,"if(node.panner)node.panner.pan.setValueAtTime(.48,ctx.currentTime)","if(node.panner)node.panner.pan.setValueAtTime(0,ctx.currentTime)")

          console='web/debug-console-v1.js'
          p=Path(console); s=p.read_text()
          s=s.replace("getElementById('lullabyDebugBridgeForceV5')?.remove();const old=doc.getElementById('lullabyDebugBridgeForceV4');old?.remove();const script=doc.createElement('script');script.id='lullabyDebugBridgeForceV5';script.src=`/debug-bridge-v1.js?v=5&force=${Date.now()}`",
                      "getElementById('lullabyDebugBridgeForceV6')?.remove();for(const id of['lullabyDebugBridgeForceV5','lullabyDebugBridgeForceV4'])doc.getElementById(id)?.remove();const script=doc.createElement('script');script.id='lullabyDebugBridgeForceV6';script.src=`/debug-bridge-v1.js?v=6&force=${Date.now()}`")
          s=s.replace('최신 브리지 v5','최신 브리지 v6')
          p.write_text(s)

          replace('web/player/index.html','/remaining-journeys-v1.js?v=27','/remaining-journeys-v1.js?v=28')
          replace('web/player/index.html','/debug-bridge-v1.js?v=5','/debug-bridge-v1.js?v=6')
          replace('web/debug/index.html','/debug-console-v1.js?v=6','/debug-console-v1.js?v=7')

          sw='web/sw.js'; p=Path(sw); s=p.read_text()
          s=s.replace("const CACHE='lullaby-scene-debug-v14'","const CACHE='lullaby-scene-debug-v15'")
          s=s.replace('/remaining-journeys-v1.js?v=27','/remaining-journeys-v1.js?v=28')
          s=s.replace('/debug-console-v1.js?v=6','/debug-console-v1.js?v=7')
          s=s.replace('/debug-bridge-v1.js?v=5','/debug-bridge-v1.js?v=6')
          p.write_text(s)
          PY

          node --check web/remaining-journeys-v1.js
          node --check web/debug-bridge-v1.js
          node --check web/debug-console-v1.js
          grep -Fq "departure:['departure','forest']" web/remaining-journeys-v1.js
          grep -Fq "phases:[2,3]" web/remaining-journeys-v1.js
          grep -Fq "panner.pan.setTargetAtTime(0" web/remaining-journeys-v1.js
          grep -Fq "reverbWet.gain.value=.50" web/debug-bridge-v1.js

      - name: Commit debug-only stage tuning
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/remaining-journeys-v1.js web/debug-bridge-v1.js web/debug-console-v1.js web/player/index.html web/debug/index.html web/sw.js
          git diff --cached --quiet && exit 0
          git commit -m 'Stage Forest Temple ambience from departure on debug'
          git push origin HEAD:debug
