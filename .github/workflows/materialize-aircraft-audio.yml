name: Materialize aircraft audio

on:
  push:
    branches:
      - work/lullaby-web-foundation
      - work/lullaby-2.0-audio-foundation
    paths:
      - '.github/workflows/materialize-aircraft-audio.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Resolve official Freesound HQ preview
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import html, re, urllib.request
          url='https://freesound.org/people/jasonm911/sounds/853735/'
          request=urllib.request.Request(url,headers={'User-Agent':'Lullaby-Scene-audio-materializer/1.0'})
          page=html.unescape(urllib.request.urlopen(request,timeout=30).read().decode('utf-8','replace'))
          patterns=[
              r'https://cdn\.freesound\.org/previews/853/853735_[^"\'<> ]+-hq\.ogg',
              r'https://freesound\.org/data/previews/853/853735_[^"\'<> ]+-hq\.ogg',
          ]
          match=None
          for pattern in patterns:
              found=re.search(pattern,page)
              if found:
                  match=found.group(0);break
          if not match:
              raise SystemExit('Could not find Freesound 853735 HQ OGG preview URL')
          print(match)
          open('/tmp/preview_url','w').write(match)
          PY
          curl --fail --location --retry 3 --output /tmp/aircraft-source.ogg "$(cat /tmp/preview_url)"
          test -s /tmp/aircraft-source.ogg
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration,size -of json /tmp/aircraft-source.ogg

      - name: Build 114 second stereo loop
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y -i /tmp/aircraft-source.ogg \
            -filter_complex "[0:a]atrim=start=6:end=114,asetpts=PTS-STARTPTS[mid];[0:a]atrim=start=114:end=120,asetpts=PTS-STARTPTS[tail];[0:a]atrim=start=0:end=6,asetpts=PTS-STARTPTS[head];[tail][head]acrossfade=d=6:c1=qsin:c2=qsin[xf];[mid][xf]concat=n=2:v=0:a=1,highpass=f=20,loudnorm=I=-24:TP=-1.5:LRA=7[out]" \
            -map "[out]" -ar 48000 -ac 2 -c:a libopus -b:a 80k -vbr on -compression_level 10 \
            /tmp/aircraft_cabin_cruise_853735.ogg
          python3 - <<'PY'
          import hashlib, json, subprocess
          path='/tmp/aircraft_cabin_cruise_853735.ogg'
          info=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=sample_rate,channels','-show_entries','format=duration,size','-of','json',path]))
          stream=info['streams'][0]; fmt=info['format']
          duration=float(fmt['duration']); size=int(fmt['size'])
          assert stream['sample_rate']=='48000', info
          assert int(stream['channels'])==2, info
          assert 113.8 <= duration <= 114.2, info
          assert size > 700000, info
          digest=hashlib.sha256(open(path,'rb').read()).hexdigest()
          print(f'duration={duration:.3f}s size={size} sha256={digest}')
          open('/tmp/aircraft_sha256','w').write(digest)
          open('/tmp/aircraft_size','w').write(str(size))
          PY

      - name: Install processed source into branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == "work/lullaby-web-foundation" ]]; then
            mkdir -p web/audio
            cp /tmp/aircraft_cabin_cruise_853735.ogg web/audio/aircraft_cabin_cruise_853735.ogg
          elif [[ "${GITHUB_REF_NAME}" == "work/lullaby-2.0-audio-foundation" ]]; then
            mkdir -p app/src/main/assets/ambience/aircraft_cabin/continuous
            cp /tmp/aircraft_cabin_cruise_853735.ogg app/src/main/assets/ambience/aircraft_cabin/continuous/aircraft_cabin_cruise_001.ogg
          else
            echo "Unexpected branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Commit generated audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/audio/aircraft_cabin_cruise_853735.ogg app/src/main/assets/ambience/aircraft_cabin/continuous/aircraft_cabin_cruise_001.ogg 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Aircraft source already materialized.'
            exit 0
          fi
          git commit -m 'feat(audio): materialize long stereo aircraft bed'
          git push origin "HEAD:${GITHUB_REF_NAME}"
