name: Build and publish v1.1.0-alpha.3

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: lullaby-v1.1.0-alpha.3
  cancel-in-progress: true

jobs:
  build-and-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.ref == 'work/lullaby-2.0-audio-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout prerelease source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify shared cleaned aircraft bed
        shell: bash
        run: |
          set -euo pipefail
          TARGET='app/src/main/assets/ambience/aircraft_cabin/continuous/aircraft_cabin_cruise_001.ogg'
          test -s "$TARGET"
          test "$(wc -c < "$TARGET")" -eq 1166883
          echo 'd6b065bd63b2ba586bff79841f23b150aea96bcd84d7c9649ef9713cd9b6d29c  app/src/main/assets/ambience/aircraft_cabin/continuous/aircraft_cabin_cruise_001.ogg' | sha256sum -c -
          grep -q 'freesound_jasonm911_853735' app/src/main/assets/ambience/manifest/scene_sources.json
          grep -q '"loop_mode": "crossfade"' app/src/main/assets/ambience/manifest/scene_sources.json
          grep -q '"crossfade_ms": 3500' app/src/main/assets/ambience/manifest/scene_sources.json
          ! grep -q 'freesound_jasonm911_853736' app/src/main/assets/ambience/manifest/scene_sources.json
          grep -q 'SEEK_SCENE' app/src/main/java/com/scene/ambience/media/Commands.kt
          grep -q 'seekToElapsedMs' app/src/main/java/com/scene/ambience/media/SceneOrchestrator.kt
          grep -q 'viewModel.seekScene' app/src/main/java/com/scene/ambience/ui/screens/ScenesScreen.kt

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests and compile prerelease
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease --stacktrace

      - name: Require persistent prerelease signing key
        env:
          KEYSTORE_B64: ${{ secrets.LULLABY_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.LULLABY_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LULLABY_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LULLABY_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for pair in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!pair:-}" ]]; then
              echo "::error::$pair is required for an updatable Android prerelease"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]] || exit 1
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lullaby-release.jks"
          chmod 600 "$RUNNER_TEMP/lullaby-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/lullaby-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "LULLABY_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lullaby-release.jks" >> "$GITHUB_ENV"
          echo "LULLABY_ANDROID_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LULLABY_ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "LULLABY_ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build prerelease-signed APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace

      - name: Verify prerelease APK signer
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify "$APK"

      - name: Prepare prerelease files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Lullaby-Scene-v1.1.0-alpha.3.apk
          sha256sum dist/Lullaby-Scene-v1.1.0-alpha.3.apk > dist/Lullaby-Scene-v1.1.0-alpha.3.apk.sha256
          test -s dist/Lullaby-Scene-v1.1.0-alpha.3.apk
          ls -lh dist

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lullaby-Scene-v1.1.0-alpha.3
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.0-alpha.3
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if gh release view "$TAG" >/dev/null 2>&1; then
            git tag -f "$TAG" "$TARGET_SHA"
            git push --force origin "refs/tags/$TAG"
            gh release upload "$TAG" \
              dist/Lullaby-Scene-v1.1.0-alpha.3.apk \
              dist/Lullaby-Scene-v1.1.0-alpha.3.apk.sha256 \
              --clobber
            gh release edit "$TAG" \
              --title "Lullaby Scene v1.1.0-alpha.3" \
              --notes-file RELEASE_NOTES_1.1.0-alpha.3.md \
              --prerelease
          else
            gh release create "$TAG" \
              dist/Lullaby-Scene-v1.1.0-alpha.3.apk \
              dist/Lullaby-Scene-v1.1.0-alpha.3.apk.sha256 \
              --target "$TARGET_SHA" \
              --title "Lullaby Scene v1.1.0-alpha.3" \
              --notes-file RELEASE_NOTES_1.1.0-alpha.3.md \
              --prerelease
          fi
