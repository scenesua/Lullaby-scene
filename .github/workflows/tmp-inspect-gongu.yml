name: Inspect Gongu source

on:
  push:
    branches:
      - tmp-mixer-chant-3
    paths:
      - '.github/workflows/tmp-inspect-gongu.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect download markup and popup
        shell: bash
        run: |
          set -euo pipefail
          base='https://gongu.copyright.or.kr'
          page="$base/gongu/wrt/wrt/view.do?menuNo=200196&wrtSn=13254274"
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$page" -o /tmp/page.html
          echo '=== download markup ==='
          sed -n '1410,1490p' /tmp/page.html
          echo '=== hidden popup file list ==='
          sed -n '2985,3220p' /tmp/page.html
          echo '=== popup response ==='
          curl -L --fail --retry 3 -A 'Mozilla/5.0' "$base/gongu/wrt/wrt/wrtDownPopup.do?viewType=BODY&wrtSn=13254274&menuNo=200196" -o /tmp/popup.html
          grep -Ein 'href=|wav|file|down|13254274' /tmp/popup.html | tail -n 160 || true
