name: Android UI preview

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '.github/workflows/android-ui-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build test APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Start Android emulator
        run: |
          sdkmanager 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --name ui-review --package 'system-images;android-35;google_apis;x86_64'
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd ui-review -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >/tmp/ui-emulator.log 2>&1 &
          adb wait-for-device
          for i in {1..90}; do
            if adb shell getprop sys.boot_completed | grep -q 1; then break; fi
            sleep 2
          done
          adb shell getprop sys.boot_completed | grep -q 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Test portrait, large text and landscape
        run: |
          adb shell wm size 1080x1920
          adb shell wm density 480
          ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.scene.ambience.IntuitiveControlsTest
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p ui-review
          adb pull /sdcard/Android/data/com.scene.ambience.debug/files/ui-review ui-review/ || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Android-UI-preview
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/reports/lint-results-debug.html
            ui-review/
          if-no-files-found: error
          retention-days: 14
