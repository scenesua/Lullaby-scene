name: Verify production visitor counter repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-counter-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live production
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://lullabyscene.com/ -o /tmp/home.html
          grep -q 'visitor-count-v1.js?v=3' /tmp/home.html

          curl -fsS --max-time 20 'https://lullabyscene.com/visitor-count-v1.js?v=3' -o /tmp/visitor.js
          grep -q "fetch('/api/visitors'" /tmp/visitor.js
          ! grep -q 'FALLBACK_BASE' /tmp/visitor.js

          GET_STATUS=$(curl -sS --max-time 20 -o /tmp/get.json -w '%{http_code}' https://lullabyscene.com/api/visitors)
          echo "GET status=$GET_STATUS"; cat /tmp/get.json; echo

          VERIFY_ID="ci-live-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          POST_STATUS=$(curl -sS --max-time 20 -o /tmp/post.json -w '%{http_code}' -X POST https://lullabyscene.com/api/visitors \
            -H 'Content-Type: application/json' \
            --data "{\"visitorId\":\"${VERIFY_ID}\",\"countTotal\":false,\"countDay\":false}")
          echo "POST status=$POST_STATUS"; cat /tmp/post.json; echo

          python3 - <<'PY'
          import json
          for path in ('/tmp/get.json','/tmp/post.json'):
              d=json.load(open(path))
              assert d.get('available') is True, (path,d)
              assert d.get('backend') in ('counterapi.com','d1'), (path,d)
              assert isinstance(d.get('today'), (int,float)), (path,d)
              assert isinstance(d.get('total'), (int,float)), (path,d)
          print('production visitor counter returns numeric values')
          PY
