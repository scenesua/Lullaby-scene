name: Materialize taxi bed for staging PR

on:
  pull_request:
    branches:
      - work/lullaby-web-foundation
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/materialize_aircraft_taxi.py'
      - '.github/workflows/taxi-audio-materialize.yml'
      - '.github/workflows/materialize-taxi-pr.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'work/lullaby-web-taxi-627056'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lullaby-web-taxi-627056
          fetch-depth: 0
      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Build 627056 taxi bed
        run: |
          python3 tools/materialize_aircraft_taxi.py web/audio/aircraft_cabin_taxi_627056_v1.ogg | tee /tmp/taxi-audio.json
          test -s web/audio/aircraft_cabin_taxi_627056_v1.ogg
          grep -q '"source_id": "627056"' /tmp/taxi-audio.json
          grep -q '"channels": 2' /tmp/taxi-audio.json
          grep -q '"sample_rate": 48000' /tmp/taxi-audio.json
      - name: Commit generated asset to staging branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/audio/aircraft_cabin_taxi_627056_v1.ogg
          git diff --cached --quiet && exit 0
          git commit -m 'feat(audio): materialize 627056 taxi bed'
          git push origin HEAD:work/lullaby-web-taxi-627056
