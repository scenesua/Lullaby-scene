name: Finish Forest Temple Korean sutra v2

on:
  push:
    branches:
      - codex/forest-temple-korean-sutra

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare tools and verify finisher syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/finish_forest_temple_korean_sutra.py .github/scripts/run_forest_temple_finisher.py
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Regenerate sources and apply handover changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/run_forest_temple_finisher.py
      - name: Validate web and metadata
        shell: bash
        run: |
          set -euo pipefail
          node --check web/remaining-journeys-v1.js
          node --check web/site-locales-v10.js
          python3 -m json.tool web/mixer-sources.json >/dev/null
          python3 -m json.tool app/src/main/assets/ambience/manifest/scene_sources.json >/dev/null
          python3 -m json.tool app/src/main/assets/ambience/manifest/external_licenses.json >/dev/null
          node .github/scripts/train-journey-parity-smoke.mjs
      - name: Validate Android manifests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon
      - name: Commit completed change without workflow-file mutations
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp_forest_temple_sources .github/scripts/__pycache__
          rm -f .github/scripts/finish_forest_temple_korean_sutra.py .github/scripts/run_forest_temple_finisher.py
          git restore --source=HEAD -- .github/workflows
          chmod 644 gradlew
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Replace Forest Temple sutra and moktak audio'
          git push origin HEAD:codex/forest-temple-korean-sutra
