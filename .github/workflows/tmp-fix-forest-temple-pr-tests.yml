name: Fix Forest Temple PR parity expectations

on:
  push:
    branches:
      - release/forest-temple-1.1.12
    paths:
      - '.github/workflows/tmp-fix-forest-temple-pr-tests.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/forest-temple-1.1.12
          fetch-depth: 0
      - name: Update production parity expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/train-journey-parity-smoke.mjs')
          s=p.read_text()
          s=s.replace('/remaining-journeys-v1.js?v=24','/remaining-journeys-v1.js?v=25')
          s=s.replace("roles:{departure:['departure'],bed:['forest','bowl']","roles:{departure:['departure','forest'],bed:['forest','bowl']")
          p.write_text(s)
          PY
          grep -Fq '/remaining-journeys-v1.js?v=25' .github/scripts/train-journey-parity-smoke.mjs
          grep -Fq "roles:{departure:['departure','forest'],bed:['forest','bowl']" .github/scripts/train-journey-parity-smoke.mjs
      - name: Commit parity fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tmp-fix-forest-temple-pr-tests.yml
          git add .github/scripts/train-journey-parity-smoke.mjs
          git commit -m 'Update Forest Temple production parity checks'
          git push origin HEAD:release/forest-temple-1.1.12
