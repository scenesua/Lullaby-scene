name: Finalize Forest Temple build 3 v2

on:
  push:
    branches:
      - tmp-mixer-chant-3
    paths:
      - '.github/workflows/tmp-finalize-forest-temple-build3-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out temp branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: tmp-mixer-chant-3
          fetch-depth: 0

      - name: Install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          ffmpeg -hide_banner -filters | grep -q asoftclip

      - name: Fetch complete original Korean chant audio
        shell: bash
        run: |
          set -euo pipefail
          original='/tmp/yeombul1_source'
          page='https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?menuNo=200196&wrtSn=13254274'
          media='https://gongu.copyright.or.kr/gongu/wrt/cmmn/wrtFileMediaPlay.do?wrtSn=13254274&fileSn=1'
          curl -L --fail --retry 4 --retry-delay 2 -A 'Mozilla/5.0' -e "$page" "$media" -o "$original"
          test -s "$original"
          echo '=== downloaded source ==='
          file "$original"
          head -c 32 "$original" | xxd
          ffprobe -v error -show_entries format=format_name,duration,size -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 "$original"
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$original")"
          python3 -c 'import sys; v=float(sys.argv[1]); assert 115 <= v <= 125, f"unexpected chant duration: {v}"' "$duration"
          mkdir -p web/audio/scenes/forest_temple_journey
          ffmpeg -hide_banner -loglevel error -y -i "$original" -map 0:a:0 -c:a libopus -b:a 96k -vbr on web/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_original_full_001.ogg
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,sample_rate,channels -of default=nw=1 web/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_original_full_001.ogg

      - name: Gently soften Forest Temple bamboo peaks
        shell: bash
        run: |
          set -euo pipefail
          src='web/audio/scenes/forest_temple_journey/forest_temple_bamboo_wide_bed_001.ogg'
          tmp='web/audio/scenes/forest_temple_journey/forest_temple_bamboo_wide_bed_001.tmp.ogg'
          ffmpeg -hide_banner -loglevel error -y -i "$src" -af 'asoftclip=type=tanh:threshold=0.82:output=0.92:oversample=2' -ar 48000 -ac 2 -c:a libopus -b:a 112k -vbr on "$tmp"
          mv "$tmp" "$src"

      - name: Sync approved Forest Temple audio into Android assets
        shell: bash
        run: |
          set -euo pipefail
          base='app/src/main/assets/ambience/forest_temple_journey'
          mkdir -p "$base/continuous" "$base/events"
          cp web/audio/scenes/forest_temple_journey/forest_temple_bamboo_wide_bed_001.ogg "$base/continuous/forest_temple_bamboo_wide_bed_001.ogg"
          cp web/audio/scenes/forest_temple_journey/forest_temple_bowl_distant_bed_001.ogg "$base/continuous/forest_temple_bowl_bed_001.ogg"
          cp web/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_original_full_001.ogg "$base/continuous/forest_temple_heart_sutra_original_full_001.ogg"
          cp web/audio/scenes/forest_temple_journey/forest_temple_moktak_event_001.ogg "$base/events/forest_temple_moktak_event_001.ogg"
          cp web/audio/scenes/forest_temple_journey/forest_temple_gravel_event_001.ogg "$base/events/forest_temple_gravel_event_001.ogg"
          cp web/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_event_001.ogg "$base/events/forest_temple_heart_sutra_event_001.ogg"

      - name: Apply code manifest credits and debug build changes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp_finalize_forest_temple_build3.py

      - name: Validate web and manifests
        shell: bash
        run: |
          set -euo pipefail
          node --check web/remaining-journeys-v1.js
          node --check web/player-v2.js
          python3 -m json.tool web/mixer-sources.json >/dev/null
          python3 -m json.tool app/src/main/assets/ambience/manifest/scene_sources.json >/dev/null
          python3 -m json.tool app/src/main/assets/ambience/manifest/external_licenses.json >/dev/null
          grep -Fq 'DEBUG_BUILD:3' web/debug/index.html
          grep -Fq 'gains:{departure:1,forest:.121,bowl:.227}' web/remaining-journeys-v1.js
          grep -Fq 'forest_temple_heart_sutra_original_full_001.ogg?v=1' web/mixer-sources.json
          ! grep -Fq '"id": "forest_temple_bowl"' web/mixer-sources.json
          grep -Fq 'SOURCE_FOREST_TEMPLE_HEART_SUTRA_EVENT' app/src/main/java/com/scene/ambience/media/SceneOrchestrator.kt

      - name: Compile Android debug Kotlin and tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Commit finalized build 3 on temp branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tmp-inspect-gongu.yml .github/workflows/tmp-finalize-forest-temple-build3.yml .github/workflows/tmp-finalize-forest-temple-build3-v2.yml tools/tmp_finalize_forest_temple_build3.py
          git add web app
          git status --short
          git commit -m 'Finalize Forest Temple web and Android audio'
          git push origin HEAD:tmp-mixer-chant-3
