name: Verify visitor counter upstream

on:
  pull_request:
    paths:
      - 'web/_worker.js'
      - 'web/visitor-count-v1.js'
      - '.github/scripts/web-visitor-fallback-smoke.mjs'
      - '.github/workflows/visitor-counter-upstream-check.yml'

jobs:
  countapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify hit and get on replacement CountAPI
        shell: bash
        env:
          COUNTER_KEY: lullaby-scene-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const key=process.env.COUNTER_KEY;
          const base='https://countapi.mileshilliard.com/api/v1';
          async function request(action){
            const response=await fetch(`${base}/${action}/${encodeURIComponent(key)}?ts=${Date.now()}`,{headers:{Accept:'application/json'}});
            if(!response.ok)throw new Error(`replacement CountAPI ${response.status}`);
            const data=await response.json();
            const value=Number(data?.value);
            if(!Number.isFinite(value)||value<0)throw new Error(`invalid counter response ${JSON.stringify(data)}`);
            return value;
          }
          const hit=await request('hit');
          const read=await request('get');
          if(hit<1)throw new Error(`hit did not increment: ${hit}`);
          if(read<1)throw new Error(`get did not observe increment: ${read}`);
          console.log(`replacement CountAPI upstream OK: hit=${hit}, get=${read}`);
          NODE
