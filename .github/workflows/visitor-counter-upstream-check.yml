name: Verify visitor counter upstream

on:
  pull_request:
    paths:
      - 'web/_worker.js'
      - 'web/visitor-count-v1.js'
      - '.github/scripts/web-visitor-fallback-smoke.mjs'
      - '.github/workflows/visitor-counter-upstream-check.yml'

jobs:
  counterapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify increment becomes visible on read-only query
        shell: bash
        env:
          NAMESPACE: lullaby-scene-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const namespace=process.env.NAMESPACE;
          const base=`https://counterapi.com/api/${encodeURIComponent(namespace)}/view/probe`;
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function request(readOnly){
            const response=await fetch(`${base}?readOnly=${readOnly?'true':'false'}&noFormatting=true&ts=${Date.now()}`,{headers:{Accept:'application/json'}});
            if(!response.ok)throw new Error(`counterapi.com ${response.status}`);
            const data=await response.json();
            const value=Number(data?.value);
            if(!Number.isFinite(value)||value<0)throw new Error(`invalid counter response ${JSON.stringify(data)}`);
            return{value,data};
          }
          const increment=await request(false);
          let confirmed=increment;
          for(let i=0;i<8&&confirmed.value<1;i++){
            await sleep(500);
            confirmed=await request(true);
          }
          if(confirmed.value<1)throw new Error(`increment never became visible: initial=${increment.value}, final=${confirmed.value}`);
          console.log(`counterapi.com upstream OK: initial=${increment.value}, confirmed=${confirmed.value}`);
          NODE
