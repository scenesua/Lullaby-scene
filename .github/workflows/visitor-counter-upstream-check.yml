name: Verify visitor counter upstream

on:
  pull_request:
    paths:
      - 'web/_worker.js'
      - 'web/visitor-count-v1.js'
      - '.github/scripts/web-visitor-fallback-smoke.mjs'
      - '.github/workflows/visitor-counter-upstream-check.yml'

jobs:
  counterapi-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify documented V1 up and read endpoints
        shell: bash
        env:
          NAMESPACE: lullaby-scene-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          BASE="https://api.counterapi.dev/v1/${NAMESPACE}/probe"
          curl -fsS --retry 2 --retry-delay 1 "${BASE}/up" > /tmp/counter-up.json
          sleep 1
          curl -fsS --retry 2 --retry-delay 1 "${BASE}" > /tmp/counter-read.json
          node <<'NODE'
          const fs=require('fs');
          const up=JSON.parse(fs.readFileSync('/tmp/counter-up.json','utf8'));
          const read=JSON.parse(fs.readFileSync('/tmp/counter-read.json','utf8'));
          const value=data=>{
            const candidates=[data?.count,data?.value,data?.data?.count,data?.data?.value,data?.result?.count,data?.result?.value];
            for(const candidate of candidates){const n=Number(candidate);if(Number.isFinite(n)&&n>=0)return n}
            throw new Error(`no numeric counter value in ${JSON.stringify(data)}`);
          };
          const upValue=value(up),readValue=value(read);
          if(upValue<1)throw new Error(`CounterAPI increment did not increase: ${upValue}`);
          if(readValue<1)throw new Error(`CounterAPI read did not observe an increment: ${readValue}`);
          console.log(`CounterAPI V1 upstream OK: up=${upValue}, read=${readValue}`);
          NODE
