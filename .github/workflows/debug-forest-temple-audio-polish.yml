name: Polish Forest Temple debug audio

on:
  push:
    branches:
      - debug
    paths:
      - '.github/workflows/debug-forest-temple-audio-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out debug
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: debug
          fetch-depth: 0

      - name: Ensure ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 2

      - name: Create distant Forest Temple bowl and improve sutra voice presence
        shell: bash
        run: |
          set -euo pipefail
          dir='web/audio/scenes/forest_temple_journey'
          bowl="$dir/forest_temple_bowl_bed_001.ogg"
          distant="$dir/forest_temple_bowl_distant_bed_001.ogg"
          sutra="$dir/forest_temple_heart_sutra_event_001.ogg"
          sutra_tmp="$dir/forest_temple_heart_sutra_event_001.tmp.ogg"

          test -s "$bowl"
          test -s "$sutra"

          # Build a journey-only distant bowl. Three repeated source cycles are processed,
          # then the stable middle cycle is cut out so the room reflections remain loop-safe.
          ffmpeg -hide_banner -loglevel error -y -stream_loop 2 -i "$bowl" \
            -filter_complex "[0:a]highpass=f=140,lowpass=f=4200,equalizer=f=2300:t=q:w=1.0:g=-4,acompressor=threshold=0.05:ratio=5:attack=1:release=180:makeup=1.25,aecho=0.62:0.52:85|190|390|650:0.26|0.16|0.09|0.05,volume=-5dB,pan=stereo|c0=0.58*c0+0.10*c1|c1=0.22*c0+0.80*c1,atrim=start=77.007:duration=77.007,asetpts=PTS-STARTPTS[out]" \
            -map '[out]' -ar 48000 -ac 2 -c:a libopus -b:a 80k -vbr on "$distant"

          # The Korean recording contains moktak transients together with the recitation.
          # Fast compression catches those hits while midrange EQ raises the voice body.
          ffmpeg -hide_banner -loglevel error -y -i "$sutra" \
            -af "highpass=f=140,lowpass=f=5200,equalizer=f=650:t=q:w=0.9:g=3,equalizer=f=1400:t=q:w=1.0:g=5,equalizer=f=2600:t=q:w=1.0:g=2,acompressor=threshold=0.025:ratio=8:attack=0.5:release=180:makeup=2.0,alimiter=limit=0.78,afade=t=in:st=0:d=1.2,afade=t=out:st=117.196:d=3" \
            -ar 48000 -ac 2 -c:a libopus -b:a 80k -vbr on "$sutra_tmp"
          mv "$sutra_tmp" "$sutra"

          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$distant"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$sutra"

      - name: Wire debug runtime, credits and cache versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib

          remaining = Path('web/remaining-journeys-v1.js')
          s = remaining.read_text()
          s = s.replace("bowl:['/audio/scenes/forest_temple_journey/forest_temple_bowl_bed_001.ogg?v=2',77.007]", "bowl:['/audio/scenes/forest_temple_journey/forest_temple_bowl_distant_bed_001.ogg?v=1',77.007]")
          s = s.replace("heartSutra:['/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_event_001.ogg?v=2',120196]", "heartSutra:['/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_event_001.ogg?v=3',120196]")
          s = s.replace("sutra?3900:type==='gravel'?5200:7200", "sutra?5200:type==='gravel'?5200:7200")
          s = s.replace("sutra?.045:type==='gravel'?.075:.09", "sutra?.075:type==='gravel'?.075:.09")
          remaining.write_text(s)

          locales = Path('web/site-locales-v10.js')
          s = locales.read_text()
          s = s.replace("forest_temple_heart_sutra:'반야심경 · 중국어'", "forest_temple_heart_sutra:'반야심경 · 한국어 독송'")
          s = s.replace("forest_temple_moktak:'Rhythmic Rhythmic Temple Moktak'", "forest_temple_moktak:'Rhythmic Temple Moktak'")
          locales.write_text(s)

          player = Path('web/player/index.html')
          s = player.read_text()
          s = s.replace('/remaining-journeys-v1.js?v=25', '/remaining-journeys-v1.js?v=26')
          s = s.replace('/site-locales-v10.js?v=19', '/site-locales-v10.js?v=20')
          s = s.replace('/debug-bridge-v1.js?v=3', '/debug-bridge-v1.js?v=4')
          player.write_text(s)

          debug = Path('web/debug/index.html')
          s = debug.read_text().replace('/debug-console-v1.js?v=4', '/debug-console-v1.js?v=5')
          debug.write_text(s)

          credits = Path('web/credits/index.html')
          s = credits.read_text()
          old_ko = '<section><h2>현재 배포본</h2><p>현재 배포본에는 별도의 저작자 표시가 필요한 CC BY 자료가 없습니다. 향후 CC BY 등 출처표시 의무가 있는 자료를 포함할 경우 이 페이지에 작품명, 저작자, 원문 링크, 라이선스와 수정 여부를 표시합니다.</p></section>'
          new_ko = '<section><h2>현재 배포본</h2><p><strong>염불소리1</strong> — 김용배, 공유마당. <a href="https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?wrtSn=13254274&amp;menuNo=200020" rel="noopener">원본 페이지</a> · <a href="https://creativecommons.org/licenses/by/4.0/deed.ko" rel="noopener">CC BY 4.0</a>. Lullaby Scene에서 수면용 공간감과 음성 명료도를 위해 필터링, 다이내믹 제어, 에코/잔향, 게인 및 페이드 조정 후 Ogg Opus로 변환했습니다.</p></section>'
          old_en = '<section><h2>Current release</h2><p>The current release contains no CC BY material that requires attribution. If a future release includes CC BY or other attribution-required material, this page will list its title, creator, source link, license, and modification notice.</p></section>'
          new_en = '<section><h2>Current release</h2><p><strong>Yeombul Sori 1 (염불소리1)</strong> — Kim Yong-bae (김용배), Sharing Yard. <a href="https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?wrtSn=13254274&amp;menuNo=200020" rel="noopener">Source page</a> · <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener">CC BY 4.0</a>. Modified by Lullaby Scene for sleep-safe spatial presentation and voice clarity using filtering, dynamics, echo/reverb, gain and fades, then encoded as Ogg Opus.</p></section>'
          if old_ko not in s or old_en not in s:
              raise SystemExit('credits baseline not found')
          s = s.replace(old_ko, new_ko).replace(old_en, new_en).replace('/site-locales-v10.js?v=19','/site-locales-v10.js?v=20')
          credits.write_text(s)

          sw = Path('web/sw.js')
          s = sw.read_text()
          s = s.replace("const CACHE='lullaby-scene-debug-v12'", "const CACHE='lullaby-scene-debug-v13'")
          s = s.replace('/site-locales-v10.js?v=19','/site-locales-v10.js?v=20')
          s = s.replace('/remaining-journeys-v1.js?v=25','/remaining-journeys-v1.js?v=26')
          s = s.replace('/debug-console-v1.js?v=3','/debug-console-v1.js?v=5')
          s = s.replace('/debug-bridge-v1.js?v=3','/debug-bridge-v1.js?v=4')
          sw.write_text(s)

          meta = Path('app/src/main/assets/ambience/manifest/external_licenses.json')
          data = json.loads(meta.read_text())
          target = next((e for e in data['entries'] if e.get('asset_id') == 'forest_temple_heart_sutra_event_001'), None)
          if not target:
              raise SystemExit('heart sutra provenance entry missing')
          audio = Path('web/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_event_001.ogg')
          target.update({
              'source_name': '염불소리1',
              'creator': '김용배',
              'source_page': 'https://gongu.copyright.or.kr/gongu/wrt/wrt/view.do?wrtSn=13254274&menuNo=200020',
              'license': 'CC-BY-4.0',
              'license_status': 'verified',
              'attribution_required': True,
              'original_filename': 'gongu_13254274_yeombul1.wav',
              'provenance_id': 'gongu_kim_yongbae_13254274',
              'sample_rate': 48000,
              'channels': 2,
              'duration_ms': 120196,
              'sha256': hashlib.sha256(audio.read_bytes()).hexdigest(),
              'transformation': 'Korean recitation from Sharing Yard source 13254274; high/low-pass filtering, voice-presence EQ, fast compression to reduce moktak transient dominance, multi-tap temple reflections from the prior derivative, limiter and edge fades; 48 kHz stereo Ogg Opus 80 kbps VBR'
          })
          data['version'] = max(int(data.get('version', 1)), 8)
          meta.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          node --check web/remaining-journeys-v1.js
          node --check web/site-locales-v10.js
          grep -Fq "forest_temple_bowl_distant_bed_001.ogg?v=1" web/remaining-journeys-v1.js
          grep -Fq "반야심경 · 한국어 독송" web/site-locales-v10.js
          grep -Fq "김용배" web/credits/index.html
          grep -Fq "CC-BY-4.0" app/src/main/assets/ambience/manifest/external_licenses.json

      - name: Commit debug-only audio polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            web/audio/scenes/forest_temple_journey/forest_temple_bowl_distant_bed_001.ogg \
            web/audio/scenes/forest_temple_journey/forest_temple_heart_sutra_event_001.ogg \
            web/remaining-journeys-v1.js \
            web/site-locales-v10.js \
            web/player/index.html \
            web/debug/index.html \
            web/credits/index.html \
            web/sw.js \
            app/src/main/assets/ambience/manifest/external_licenses.json
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m 'Polish distant temple audio on debug'
          git push origin HEAD:debug
