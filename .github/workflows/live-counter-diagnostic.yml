name: Diagnose production visitor counter

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-counter-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production site and visitor backends
        shell: bash
        run: |
          set -u
          echo '=== homepage ==='
          curl -sS -D /tmp/home.headers -o /tmp/home.body --max-time 20 https://lullabyscene.com/ || true
          cat /tmp/home.headers || true
          grep -o 'visitor-count-v1.js[^"<]*' /tmp/home.body || true

          echo '=== deployed visitor JS ==='
          curl -sS -D /tmp/js.headers -o /tmp/js.body --max-time 20 'https://lullabyscene.com/visitor-count-v1.js?v=2' || true
          cat /tmp/js.headers || true
          head -c 800 /tmp/js.body || true
          echo

          echo '=== same-origin visitor API GET ==='
          curl -sS -D /tmp/api.headers -o /tmp/api.body --max-time 20 https://lullabyscene.com/api/visitors || true
          cat /tmp/api.headers || true
          cat /tmp/api.body || true
          echo

          echo '=== old CounterAPI v1 ==='
          curl -sS -D /tmp/counter.headers -o /tmp/counter.body --max-time 20 -H 'Origin: https://lullabyscene.com' 'https://api.counterapi.dev/v1/lullaby-scene-site/visitors-total-v1' || true
          cat /tmp/counter.headers || true
          cat /tmp/counter.body || true
          echo

          echo '=== replacement counterapi.com track/read ==='
          NS='lullaby-scene-ci-diagnostic'
          KEY='visitor-probe'
          VISITOR_UID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS --max-time 20 "https://counterapi.com/api/${NS}/visitor/${KEY}?userId=${VISITOR_UID}&trackOnly=true" | tee /tmp/new-track.json
          echo
          curl -fsS --max-time 20 "https://counterapi.com/api/${NS}/visitor/${KEY}?readOnly=true&unique=true" | tee /tmp/new-total.json
          echo
          curl -fsS --max-time 20 "https://counterapi.com/api/${NS}/visitor/${KEY}?readOnly=true&unique=true&timeline=1d" | tee /tmp/new-day.json
          echo
          python3 - <<'PY'
          import json
          for p in ('/tmp/new-total.json','/tmp/new-day.json'):
              data=json.load(open(p))
              assert isinstance(data.get('value'), (int,float)), (p,data)
          print('replacement counter backend returned numeric unique counts')
          PY
