name: Diagnose production visitor counter

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/live-counter-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production site and visitor backends
        shell: bash
        run: |
          set -u
          echo '=== homepage ==='
          curl -sS -D /tmp/home.headers -o /tmp/home.body --max-time 20 https://lullabyscene.com/ || true
          cat /tmp/home.headers || true
          grep -o 'visitor-count-v1.js[^"<]*' /tmp/home.body || true

          echo '=== same-origin visitor API GET ==='
          curl -sS -D /tmp/api.headers -o /tmp/api.body --max-time 20 https://lullabyscene.com/api/visitors || true
          cat /tmp/api.headers || true
          cat /tmp/api.body || true
          echo

          echo '=== old CounterAPI v1 ==='
          curl -sS -D /tmp/counter.headers -o /tmp/counter.body --max-time 20 'https://api.counterapi.dev/v1/lullaby-scene-site/visitors-total-v1' || true
          cat /tmp/counter.headers || true
          cat /tmp/counter.body || true
          echo

          echo '=== replacement counterapi.com immediate increment/read ==='
          NS='lullaby-scene-ci-diagnostic'
          KEY="visitor-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsS --max-time 20 "https://counterapi.com/api/${NS}/visitor/${KEY}?noFormatting=true" | tee /tmp/new-inc.json
          echo
          curl -fsS --max-time 20 "https://counterapi.com/api/${NS}/visitor/${KEY}?readOnly=true&noFormatting=true" | tee /tmp/new-read.json
          echo
          python3 - <<'PY'
          import json
          inc=json.load(open('/tmp/new-inc.json'))
          read=json.load(open('/tmp/new-read.json'))
          assert isinstance(inc.get('value'), (int,float)), inc
          assert isinstance(read.get('value'), (int,float)), read
          assert inc['value'] >= 1, inc
          assert read['value'] == inc['value'], (inc,read)
          print('replacement counter backend increments immediately and readOnly returns the same numeric value')
          PY
