<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive">
  <title>Lullaby Scene · Debug</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d12;--surface:#121620;--raised:#181e2a;--line:#293142;--text:#edf1f7;--muted:#8792a6;--blue:#7ca7ff;--green:#59d39b;--red:#ff7d86;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}button,select,input{font:inherit}button,select{min-height:42px;border:1px solid var(--line);background:var(--raised);color:var(--text);border-radius:8px}button{padding:0 13px;cursor:pointer}button:hover{border-color:#52627d}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}body[data-busy=true] button,body[data-busy=true] select{pointer-events:none;opacity:.58}.shell{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr);min-height:100vh}.console{padding:20px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}.brand{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:20px}.brand h1{font-size:19px;margin:0 0 5px}.brand p{margin:0;color:var(--muted);font-size:13px}.secure{font:700 10px ui-monospace,monospace;letter-spacing:.08em;color:var(--green);white-space:nowrap}.group{padding:16px 0;border-top:1px solid var(--line)}.group h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px}.field{display:grid;gap:6px;margin-bottom:10px}.field label{font-size:12px;color:var(--muted)}select{width:100%;padding:0 10px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons .primary{border-color:#557dce;background:#264b89}.buttons .danger{border-color:#6e3740;color:#ffc2c7}.inline{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:end}.toggle{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);margin-top:10px}.toggle input{width:18px;height:18px}.notice{min-height:38px;margin:12px 0 0;padding:10px;border-radius:7px;background:#0e1219;color:var(--muted);font-size:12px}.notice[data-kind=ok]{color:var(--green)}.notice[data-kind=error]{color:var(--red)}.state-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.state-grid>div{min-width:0;padding:9px;background:#0e1219;border-radius:6px}.state-grid small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.state-grid strong{display:block;font:600 11px ui-monospace,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nodes{display:grid;gap:8px}.nodes article{padding:10px;background:#0e1219;border-radius:7px}.nodes header{display:flex;justify-content:space-between;gap:8px}.tag{font:700 9px ui-monospace,monospace;color:var(--muted)}.tag.active{color:var(--blue)}dl{display:grid;grid-template-columns:1fr 1fr;margin:9px 0 0;gap:4px 12px}dl div{display:flex;justify-content:space-between;font:11px ui-monospace,monospace}dt{color:var(--muted)}dd{margin:0}.voices{display:grid;gap:3px;margin-top:8px;color:var(--muted);font:10px ui-monospace,monospace}.empty{font-size:12px;color:var(--muted)}pre{margin:0;max-height:180px;overflow:auto;white-space:pre-wrap;color:#aeb8ca;font:10px/1.55 ui-monospace,monospace}.preview{position:sticky;top:0;height:100vh;background:#050609}.preview iframe{width:100%;height:100%;border:0;background:#050609}@media(max-width:840px){.shell{display:block}.console{border-right:0;border-bottom:1px solid var(--line)}.preview{position:relative;height:78vh}.state-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body data-busy="false">
  <main class="shell">
    <aside class="console">
      <!-- DEBUG_BUILD:6 — increment this by exactly 1 with every debug deployment commit. -->
      <div id="debugBuildVersion" style="margin:-4px 0 16px;padding:12px 14px;border:1px solid #557dce;border-radius:9px;background:#172746;color:#bcd2ff;font:700 13px ui-monospace,monospace;letter-spacing:.02em">현재 디버그 버전 · <strong style="font-size:18px;color:#fff">#10</strong></div>
      <header class="brand"><div><h1>Lullaby Scene Debug</h1><p>실제 여정 런타임 재현 콘솔</p></div><span class="secure">ACCESS ONLY</span></header>
      <section class="group"><h2>Target</h2><div class="field"><label for="journeySelect">테스트 여정</label><select id="journeySelect"><option value="passenger_aircraft_cabin">여객기 객실</option><option value="train_journey">야간 열차</option><option value="spacecraft_journey">우주선 표류</option><option value="ferry_journey">야간 페리</option><option value="submarine_journey">잠수함 항해</option><option value="forest_temple_journey">숲속 절</option><option value="hood_journey">HOOD Night</option></select></div><div class="buttons"><button class="primary" data-command="play">▶ 재생 / 일시정지</button><button class="danger" data-command="stop">■ 완전 정지</button></div></section>
      <section class="group"><h2>Reproduce</h2><div class="field"><label for="eventType">즉시 발생 이벤트</label><select id="eventType"><option value="primary">객실 차임</option></select></div><button class="primary" data-command="event" style="width:100%">⚡ 선택 이벤트 즉시 발생</button><div class="inline" style="margin-top:8px"><button data-command="loop">↻ 다음 루프 직전으로</button><div class="field" style="margin:0"><label for="loopLead">남은 초</label><select id="loopLead"><option value="0.5">0.5s</option><option value="1.5" selected>1.5s</option><option value="3">3s</option></select></div></div><label class="toggle"><input id="eventEnabled" type="checkbox" checked>랜덤 이벤트 스케줄러 켜기</label></section>
      <section class="group"><h2>Timeline</h2><div class="field"><label for="stageSelect">단계 바로 이동</label><select id="stageSelect"><option value="0">1단계</option><option value="1">2단계</option><option value="2">3단계 / 주 루프</option><option value="3">4단계</option><option value="4">5단계 / 도착</option></select></div><div class="buttons"><button data-command="prev">← 이전 단계</button><button data-command="next">다음 단계 →</button><button data-command="short">5분 압축 여정</button><button data-command="reload">플레이어 재시작</button></div></section>
      <section class="group"><h2>Runtime</h2><div class="state-grid" id="debugState"></div><div class="notice" id="debugNotice">플레이어 연결 대기 중…</div></section>
      <section class="group"><h2>Audio Nodes</h2><div class="nodes" id="debugNodes"></div></section>
      <section class="group"><h2>Audio Context</h2><div class="buttons"><button data-command="suspend">Suspend</button><button data-command="resume">Resume</button></div></section>
      <section class="group"><h2>Logs</h2><pre id="debugLogs"></pre><button data-command="clear" style="margin-top:8px;width:100%">로그 초기화</button></section>
    </aside>
    <section class="preview" aria-label="Lullaby Scene player"><iframe id="debugPlayer" src="/player/?debug=1" title="Lullaby Scene debug player" allow="autoplay; fullscreen"></iframe></section>
  </main>
  <script src="/debug-console-v1.js?v=9"></script>
  <!-- debug deploy trigger after Git reconnect: 2026-08-27 -->
</body>
</html>
